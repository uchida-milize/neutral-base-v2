5Z"></path></svg><span class="text-[14px] font-medium text-neutral-600">ご本人名義のクレジットカード</span></div></div><div class="border-t border-primary-100 mb-[45px]"></div><div class="text-center mb-6"><h2 class="text-h3 font-bold text-neutral-900 leading-snug text-balance">5つのプランから選ぶだけ</h2><p class="mt-2 text-h6 text-neutral-500 leading-relaxed text-balance">最短10分で、お申し込みが完了します。</p></div><div><div class="flex flex-col items-center text-center gap-3"><span class="inline-flex items-center gap-1 rounded-full bg-white px-3 py-2 text-caption font-bold shadow-sm" style="color:var(--color-emphasis)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><path d="M20 6L9 17l-5-5"></path></svg>いつでも見直し・解約OK</span></div></div><div class="mt-8 flex flex-col items-center gap-[2px]"><p class="text-caption font-bold text-primary-500">まずはプランを選んでみましょう</p><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6 text-primary-500 animate-bounce"><path d="M6 9l6 6 6-6"></path></svg></div></div></div></div></div><div class="absolute inset-0 z-50"><div class="absolute inset-0 bg-black/40 fade-in"></div><div class="sheet-up absolute left-0 right-0 bottom-0 bg-white rounded-t-2xl shadow-xl max-h-[88%] flex flex-col"><div class="flex items-center justify-between gap-2 px-6 pt-4 pb-3 border-b border-warm-200"><h3 class="text-h6 font-bold text-neutral-800 leading-snug">保険商品のご案内にあたりご確認・同意いただきたいこと</h3><button class="grid place-items-center w-8 h-8 rounded-full bg-warm-100 text-neutral-500 shrink-0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="w-4 h-4"><path d="M18 6L6 18M6 6l12 12"></path></svg></button></div><div class="flex-1 overflow-y-auto no-sb px-4 py-4 space-y-3"><p class="text-h6 font-bold text-neutral-800 pt-2">1．お客さまに関する情報のお取扱いについて</p><p class="text-caption text-neutral-600 leading-relaxed">(1) 当行はお客さまへの保険商品のご提案にあたり、当行とお客さまとの取引時に知り得た、また今後知り得るお客さまの取引に関する情報（預金の残高・入出金・満期、融資の使途・残高、為替・金融商品取引等の内容や運用・検討状況に関する情報等、資産・収支・業務の状況等）を、対面・郵便・電話・インターネット等を用いたコンサルティングのために利用することがございます。</p><p class="text-caption text-neutral-600 leading-relaxed">(2) 保険商品の取扱いにあたり、お客さまのご契約内容等知り得た情報（保険商品のご提案内容やご契約内容に関する情報の他家族構成等に関する情報）を、対面・郵便・電話・インターネット等を用いて預金・為替・融資等のお取引、金融商品のご案内、各種サービスのご提供等の業務に利用することがございます。</p><p class="text-caption text-neutral-600 leading-relaxed">(3) 上記お客さまの情報については、お客さまから特段のお申し出がない限り利用させていただきますが、利用停止をご希望の場合には、当行の本支店窓口へお申し出いただくか、以下の窓口までご連絡ください。</p><p class="text-[11px] text-neutral-500 leading-relaxed whitespace-pre-line">お申し出窓口：●●　●●●●-●●-●●
受付時間：9:00〜17:30（但し、銀行休業日を除きます）</p><p class="text-h6 font-bold text-neutral-800 pt-2">2．引受保険会社からの情報提供</p><p class="text-caption text-neutral-600 leading-relaxed">お客様の保険契約に関し、今回お申し込みいただく保険会社から提供を受けた契約の維持・管理の為に有するご契約情報（契約者の情報、保険金額、保険料などの保険契約の情報および積立金・配当・解約金などの保険契約に関連付随する情報【健康・医療情報を除く】）を当行がお客様に提供させていただく各種サービス（預金、他の金融商品のご案内等）に利用することがあります。</p><p class="text-h6 font-bold text-neutral-800 pt-2">3．保険商品のご購入のご検討に際して</p><p class="text-caption text-neutral-600 leading-relaxed">保険募集に係る当行とお客様とのお取り引きが、当行におけるお客様の他のお取り引きに影響を与えることはありません。</p><p class="text-caption text-neutral-600 leading-relaxed">保険商品は保険会社を引受とする保険商品であり預金とは異なります。したがって、預金と違い元本保証はありません。また預金保険制度の対象外です。</p><p class="text-caption text-neutral-600 leading-relaxed">保険契約はお客様と保険会社の間で締結されます。当行は、生命保険契約について契約締結の媒介を行っており、保険契約の代理権はありません。したがって、契約の成立は保険会社による承諾後となります。</p><p class="text-caption text-neutral-600 leading-relaxed">保険商品にお申込みいただいても、引受保険会社による審査や法令等により、お引き受けできない場合があります。</p><p class="text-caption text-neutral-600 leading-relaxed">既にご契約いただいている保険契約を今回見直される場合、新規契約の承諾や保障開始日（がん保険であれば90日経過後）を確認のうえ、旧契約の解約を行っていただきますよう、ご留意ください。</p><p class="text-caption text-neutral-600 leading-relaxed">当行が保険の募集を行う場合、当該保険募集を株式会社FFGほけんサービスと共同で行います。</p><p class="text-caption text-neutral-600 leading-relaxed">この場合当該保険募集を通じて知りえた情報（お客様のご契約内容、申込書記載事項等）および当行とのお取り引きに関する情報を株式会社FFGほけんサービスに提供し、当行ならびに株式会社FFGほけんサービスが共同で保険契約の募集・維持・管理に活用させていただきます。</p><p class="text-[11px] text-neutral-500 leading-relaxed whitespace-pre-line">代理店名 ●●●●
所在地 ●●●●●●
電話番号 ●●●●-●●-●●</p><p class="text-h6 font-bold text-neutral-800 pt-2">4．保険募集制限先等の確認について</p><p class="text-caption text-neutral-600 leading-relaxed">当行取扱いの保険商品（除く、個人年金保険・長期火災保険・個人契約の一時払終身保険）の募集にあたって、お客さまが以下に該当される方である場合には、法令等の定めによってご契約のお申込みをいただけない場合がございます。誠に恐れ入りますが、この点につきまして予めご了承いただきますよう、お願い申しあげます。</p><p class="text-caption text-neutral-600 leading-relaxed">① 当行の事業資金のご融資先である法人・その代表者および個人事業主の方</p><p class="text-caption text-neutral-600 leading-relaxed">② 当行の事業性資金のご融資先である法人（代表者に対するご融資を含みます）および個人事業主のうち、従業員数が50名以下の事業所に常時勤務されている従業員および役員（代表者除く）の方</p><p class="text-[11px] text-neutral-500 leading-relaxed whitespace-pre-line">※パート・アルバイト等の方で、2ヶ月を超えて勤務されており、かつ正社員と概ね同等の勤務形態の場合は「従業員」とします。</p><p class="text-caption text-neutral-600 leading-relaxed">③ 現在、当行に事業資金融資をお申込みいただいている期間中である</p><p class="text-h6 font-bold text-neutral-800 pt-2">5．ご確認いただきたいこと</p><p class="text-caption font-bold text-neutral-800 pt-1">1．当行の「特定関係法人※1」に該当する企業・団体に勤務されているお客さまへ</p><p class="text-caption text-neutral-600 leading-relaxed">当行の「特定関係法人※1」に該当する企業・団体に勤務されているお客さまに対しては、当行は医療保険・がん保険・傷害保険に限り募集を行うことができます。</p><p class="text-caption font-bold text-neutral-800 pt-1">2．当行に事業性資金等のご融資を申込み中のお客さまへ</p><p class="text-caption text-neutral-600 leading-relaxed">お客さま※2が当行に事業性資金等のご融資※3をお申込み中の間は、当行はお客さまに対して、医療保険、その他一部の保険商品の募集を行いません。</p><p class="text-caption font-bold text-neutral-800 pt-1">3．法人代表者、個人事業主のお客さまへ</p><p class="text-caption text-neutral-600 leading-relaxed">当行が事業性資金等のご融資※3を行っているお客さまに対して、医療保険、その他一部の保険商品の募集は原則として行いません。</p><p class="text-caption font-bold text-neutral-800 pt-1">4．会社役員（代表者を除きます）、従業員のお客さまへ</p><p class="text-caption text-neutral-600 leading-relaxed">当行が事業性資金等のご融資を行っている、常時使用する従業員数※4が50名以下の事業者にお勤めのお客さまに対して、医療保険、その他一部の保険商品の募集は原則として行いません。</p><p class="text-[11px] text-neutral-500 leading-relaxed whitespace-pre-line">※1 「特定関係法人」とは、当行の関連会社・団体をはじめとする出資関係か人的関係等により、当行と密接な関係がある法人を指します。「特定関係法人」に勤務されているお客さまは、当行では医療保険・がん保険に限りお申込いただけます。
