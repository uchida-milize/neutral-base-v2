yle="width:100%;max-width:260px"><button data-slot="button" class="inline-flex items-center justify-center whitespace-nowrap text-sm transition-colors duration-200 ease-out disabled:pointer-events-none disabled:opacity-50 [&amp;_svg]:pointer-events-none [&amp;_svg:not([class*=&#x27;size-&#x27;])]:size-4 shrink-0 [&amp;_svg]:shrink-0 outline-none focus-visible:border-ring focus-visible:ring-ring/50 focus-visible:ring-[3px] aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 aria-invalid:border-destructive bg-primary shadow-xs hover:bg-button-primary-hover py-2 has-[&gt;svg]:px-3 h-16 md:h-16 rounded-xl gap-2 px-4 font-bold active:scale-[.99] text-white w-full" type="button" style="background-image:linear-gradient(135deg, #075FE3 0%, #64B0F7 100%)">入力内容を確認する<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><path d="M9 18l6-6-6-6"></path></svg></button></div></div></div><div class="absolute inset-0 z-50"><div class="absolute inset-0 bg-black/40 fade-in"></div><div class="sheet-up absolute left-0 right-0 bottom-0 bg-white rounded-t-2xl shadow-xl max-h-[88%] flex flex-col"><div class="flex items-center justify-between gap-2 px-6 pt-4 pb-3 border-b border-warm-200"><h3 class="flex items-center gap-2 text-h6 font-bold text-neutral-800 min-w-0"><span class="grid place-items-center w-6 h-6 rounded-full shrink-0 text-white" style="background:var(--color-attention)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" class="w-3 h-3"><path d="M12 6v8"></path><path d="M12 18v.01"></path></svg></span><span>障害介護保障型<!-- -->　死亡保障<!-- -->あり<!-- -->の告知項目</span></h3><button class="grid place-items-center w-8 h-8 rounded-full bg-warm-100 text-neutral-500 shrink-0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="w-4 h-4"><path d="M18 6L6 18M6 6l12 12"></path></svg></button></div><div class="flex-1 overflow-y-auto no-sb px-4 py-4 space-y-3"><p class="text-h5 font-bold text-neutral-800 leading-snug pt-1">告知に関する重要事項</p><p class="text-caption text-neutral-600 leading-relaxed whitespace-pre-line">下記の内容をご確認のうえ、お申し込みください。</p><p class="text-caption font-bold text-neutral-800 leading-relaxed">保険商品お申し込みの方へ</p><p class="text-caption text-neutral-600 leading-relaxed whitespace-pre-line">募集用資料・告知書・告知説明資料等において、ご契約者や被保険者は健康状態等について告知をしていただく義務があります。</p><p class="text-caption text-neutral-600 leading-relaxed whitespace-pre-line">生命保険は、多数の人々が公平に保険料を出し合い、相互に保険し合う制度です。したがって、初めから健康状態の良くない方や危険な職業に従事されている方等が無条件に契約されますと、保険料負担の公平性が保てません。</p><p class="text-caption text-neutral-600 leading-relaxed whitespace-pre-line">ご契約にあたっては、過去の傷病歴（傷病名・治療期間等）、現在の健康状態、身体の障がい状態、職業歴とうについて「告知書」で当社がおたずねすることについて、事実をありのままに正確にもれなくお知らせ（告知）ください</p><p class="text-caption text-neutral-600 leading-relaxed whitespace-pre-line">ご契約（責任開始期）前に生じた病気やケガにより、支払事由が生じた場合には、保険金・給付金はお支払い出来ません。（事例）契約前より高血圧・脂質異常で定期的に服薬中の場合
以下告知項目に該当しませんが、契約3ヶ月後に直接的な原因により脳梗塞が発症した場合などはお支払い出来ないことがあります。</p><p class="text-caption text-neutral-600 leading-relaxed whitespace-pre-line">※ただし、以下のような場合には責任開始期以後発生した原因によるものとみなし、保険金・給付金をお支払いします。</p><ul class="space-y-2"><li class="flex gap-2 text-caption text-neutral-600 leading-relaxed"><span class="text-neutral-400 shrink-0">・</span><span class="whitespace-pre-line">責任開始期から2年を経過した後で支払事由が生じた場合</span></li><li class="flex gap-2 text-caption text-neutral-600 leading-relaxed"><span class="text-neutral-400 shrink-0">・</span><span class="whitespace-pre-line">責任開始期以降、その疾病やケガによって医師の診察を受けたことがなく、かつ診断等による異常な指摘も受けていない場合。ただし、その原因となった病気やケガによる症状について被保険者が認識または自覚していた場合を除きます。</span></li></ul><div class="rounded-xl px-4 py-3 flex items-start gap-2" style="background:#F0F7FF;border:1px solid #C8DCFA"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="w-4 h-4 shrink-0 mt-[2px]" style="color:var(--color-primary)"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5"></path><path d="M12 16v.01"></path></svg><p class="text-caption leading-relaxed" style="color:#054EBA">各質問に対して<strong>「はい」に当てはまる場合はお申し込みいただけません。</strong></p></div><div class="space-y-3"><div class="pt-8"><p class="text-h5 font-bold text-neutral-800 leading-snug">告知重要事項</p><p class="text-caption text-neutral-600 leading-relaxed mt-1">各項目をご確認のうえ、以下の内容にご回答ください。</p></div><p class="text-[11px] font-bold text-neutral-500 pt-1 pb-[2px] border-b border-warm-200">最近の健康状態</p><div class="rounded-xl border border-warm-200 bg-white overflow-hidden"><div class="px-3 pt-3 pb-3 space-y-2"><div><p class="text-caption leading-relaxed text-neutral-700"><strong class="font-bold text-neutral-900 text-[14px]">最近3ヶ月以内に、医師より検査・入院・手術を勧められたことがありますか。（検査には、健康診断、人間ドック、歯科検査、アレルギー検査を含みません）</strong></p></div></div></div><p class="text-[11px] font-bold text-neutral-500 pt-1 pb-[2px] border-b border-warm-200">病気・ケガについて</p><div class="rounded-xl border border-warm-200 bg-white overflow-hidden"><div class="px-3 pt-3 pb-3 space-y-2"><div><p class="text-caption leading-relaxed text-neutral-700"><strong class="font-bold text-neutral-900 text-[14px]">過去5年以内に別表の病気で、医師による診療・検査・治療・薬の処方を受けたことがありますか。</strong></p><div class="mt-2 rounded-lg border border-warm-200 overflow-hidden"><div class="grid grid-cols-[88px_1fr] "><div class="bg-warm-100 px-2 py-2 flex items-center border-r border-warm-200"><span class="text-[11px] font-bold text-neutral-600 leading-snug">心臓・血液</span></div><div class="px-2 py-2 text-[11px] text-neutral-700 leading-relaxed">狭心症、心筋梗塞、心臓弁膜症、不整脈、心筋症、心不全、大動脈瘤</div></div><div class="grid grid-cols-[88px_1fr] border-t border-warm-200"><div class="bg-warm-100 px-2 py-2 flex items-center border-r border-warm-200"><span class="text-[11px] font-bold text-neutral-600 leading-snug">脳</span></div><div class="px-2 py-2 text-[11px] text-neutral-700 leading-relaxed">脳卒中（脳出血、脳梗塞、くも膜下出血）、脳動脈瘤、脳しゅよう</div></div><div class="grid grid-cols-[88px_1fr] border-t border-warm-200"><div class="bg-warm-100 px-2 py-2 flex items-center border-r border-warm-200"><span class="text-[11px] font-bold text-neutral-600 leading-snug">精神・神経</span></div><div class="px-2 py-2 text-[11px] text-neutral-700 leading-relaxed">認知症、うつ病、統合失調症、アルコール依存症、てんかん、パーキンソン病、脊髄小脳変性症、多系統萎縮症、筋萎縮性側索硬化症、多発性硬化症</div></div><div class="grid grid-cols-[88px_1fr] border-t border-warm-200"><div class="bg-warm-100 px-2 py-2 flex items-center border-r border-warm-200"><span class="text-[11px] font-bold text-neutral-600 leading-snug">肝臓・腎臓・膵臓</span></div><div class="px-2 py-2 text-[11px] text-neutral-700 leading-relaxed">慢性肝炎、肝硬変、慢性腎炎、ネフローゼ、腎不全、すい炎</div></div><div class="grid grid-cols-[88px_1fr] border-t border-warm-200"><div class="bg-warm-100 px-2 py-2 flex items-center border-r border-warm-200"><span class="text-[11px] font-bold text-neutral-600 leading-snug">肺</span></div><div class="px-2 py-2 text-[11px] text-neutral-700 leading-relaxed">肺気腫、閉塞性肺疾患、間質性肺炎、誤嚥性肺炎</div></div><div class="grid grid-cols-[88px_1fr] border-t border-warm-200"><div class="bg-warm-100 px-2 py-2 flex items-center border-r border-warm-200"><span class="text-[11px] font-bold text-neutral-600 leading-snug">目</span></div><div class="px-2 py-2 text-[11px] text-neutral-700 leading-relaxed">緑内障、加齢黄斑変性症、網膜色素変性症</div></div><div class="grid grid-cols-[88px_1fr] border-t border-warm-200"><div class="bg-warm-100 px-2 py-2 flex items-center border-r border-warm-200"><span class="text-[11px] font-bold text-neutral-600 leading-snug">悪性新生物</span></div><div class="px-2 py-2 text-[11px] text-neutral-700 leading-relaxed">がん、肉腫、悪性の腫瘍、白血病、悪性リンパ腫、骨髄腫、骨髄異形成症候群</div></div><div class="grid grid-cols-[88px_1fr] border-t border-warm-200"><div class="bg-warm-100 px-2 py-2 flex items-center border-r border-warm-200"><span class="text-[11px] font-bold text-neutral-600 leading-snug">その他</span></div><div class="px-2 py-2 text-[11px] text-neutral-700 leading-relaxed">合併症を伴う糖尿病、膠原病（関節リウマチ、全身性エリテマトーデス（SLE）、強皮症、多発性筋炎、結節性多発動脈周囲炎）</div></div></div></div></div></div><p class="text-[11px] font-bold text-neutral-500 pt-1 pb-[2px] border-b border-warm-200">身体の障がい・介護状態について</p><div class="rounded-xl border border-warm-200 bg-white overflow-hidden"><div class="px-3 pt-3 pb-3 space-y-2"><div><p class="text-caption leading-relaxed text-neutral-700"><strong class="font-bold text-neutral-900 text-[14px]">つぎのいずれか1つでも該当することはありますか。</strong></p></div><div><p class="text-caption leading-relaxed text-neutral-700"><span>●今までに、公的介護保険制度の要介護または要支援の認定を受けていたこと、もしくは、認定申請をしたことがある（40歳未満の方は該当しません）</span></p></div><div><p class="text-caption leading-relaxed text-neutral-700"><span>●現在、つぎの1〜5の日常生活のいずれかにおいて、他の方の介助またはご自身で補助具を必要とすることがある。＊骨折中などにより現在一時的に必要とする場合も含みます。＜1.歩行 2.衣服の着替え 3.入浴 4.食事 5.排泄＞</span></p></div></div></div></div></div><div class="px-6 py-3 border-t border-warm-200"><div class="space-y-2"><div class="grid grid-cols-2 gap-x-3 gap-y-6"><button class="flex flex-col items-center justify-center gap-[2px] rounded-xl py-3 font-bold border-2 transition-colors" style="border-color:var(--color-attention);color:var(--color-attention);background:#FFF5F5"><span class="flex items-center gap-2 text-h6 font-bold"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" class="w-4 h-4"><path d="M18 6L6 18M6 6l12 12"></path></svg>はい</span><span class="text-[10px] font-medium leading-tight" style="color:var(--color-attention)">１つでも存在する</span></button><button class="flex flex-col items-center justify-center gap-[2px] rounded-xl py-3 font-bold border-2 transition-colors" style="border-color:#16A34A;color:#16A34A;background:#F0FDF4"><span class="flex items-center gap-2 text-h6 font-bold"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" class="w-4 h-4"><path d="M5 12l5 5L19 7"></path></svg>いいえ</span><span class="text-[10px] font-medium leading-tight" style="color:#16A34A">すべていいえ</span></button></div><p class="text-center text-[11px] text-neutral-400">すべての項目が「いいえ」の場合に進めます</p></div></div></div></div></div></div></figure><figure class="flex flex-col items-start gap-2" style="width:390px"><figcaption class="flex items-center gap-2"><p class="text-h6 font-semibold text-foreground">② 障害・介護プラン（死亡なし）</p><a href="/theo-tdf-view?s=3&amp;disclosure=1&amp;kokuchiPattern=care_n" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 rounded-full border border-warm-300 bg-white px-2 py-0.5 text-[10px] font-medium text-neutral-400 shadow-sm hover:border-primary hover:text-primary transition-colors shrink-0">HTML <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-3 h-3 shrink-0"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg></a></figcaption><div class="theo-tdf-cd font-jp screen-flat relative rounded-2xl border border-warm-200 bg-warm-50 shad border-destructive bg-primary shadow-xs hover:bg-button-primary-hover py-2 has-[&gt;svg]:px-3 h-16 md:h-16 rounded-xl gap-2 px-4 font-bold active:scale-[.99] text-white w-full" type="button" style="background-image:linear-gradient(135deg, #075FE3 0%, #64B0F7 100%)">入力内容を確認する<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><path d="M9 18l6-6-6-6"></path></svg></button></div></div></div><div class="absolute inset-0 z-50"><div class="absolute inset-0 bg-black/40 fade-in"></div><div class="sheet-up absolute left-0 right-0 bottom-0 bg-white rounded-t-2xl shadow-xl max-h-[88%] flex flex-col"><div class="flex items-center justify-between gap-2 px-6 pt-4 pb-3 border-b border-warm-200"><h3 class="flex items-center gap-2 text-h6 font-bold text-neutral-800 min-w-0"><span class="grid place-items-center w-6 h-6 rounded-full shrink-0 text-white" style="background:var(--color-attention)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" class="w-3 h-3"><path d="M12 6v8"></path><path d="M12 18v.01"></path></svg></span><span>障害介護保障型<!-- -->　死亡保障<!-- -->なし<!-- -->の告知項目</span></h3><button class="grid place-items-center w-8 h-8 rounded-full bg-warm-100 text-neutral-500 shrink-0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="w-4 h-4"><path d="M18 6L6 18M6 6l12 12"></path></svg></button></div><div class="flex-1 overflow-y-auto no-sb px-4 py-4 space-y-3"><p class="text-h5 font-bold text-neutral-800 leading-snug pt-1">告知に関する重要事項</p><p class="text-caption text-neutral-600 leading-relaxed whitespace-pre-line">下記の内容をご確認のうえ、お申し込みください。</p><p class="text-caption font-bold text-neutral-800 leading-relaxed">保険商品お申し込みの方へ</p><p class="text-caption text-neutral-600 leading-relaxed whitespace-pre-line">募集用資料・告知書・告知説明資料等において、ご契約者や被保険者は健康状態等について告知をしていただく義務があります。</p><p class="text-caption text-neutral-600 leading-relaxed whitespace-pre-line">生命保険は、多数の人々が公平に保険料を出し合い、相互に保険し合う制度です。したがって、初めから健康状態の良くない方や危険な職業に従事されている方等が無条件に契約されますと、保険料負担の公平性が保てません。</p><p class="text-caption text-neutral-600 leading-relaxed whitespace-pre-line">ご契約にあたっては、過去の傷病歴（傷病名・治療期間等）、現在の健康状態、身体の障がい状態、職業歴とうについて「告知書」で当社がおたずねすることについて、事実をありのままに正確にもれなくお知らせ（告知）ください</p><p class="text-caption text-neutral-600 leading-relaxed whitespace-pre-line">ご契約（責任開始期）前に生じた病気やケガにより、支払事由が生じた場合には、保険金・給付金はお支払い出来ません。（事例）契約前より高血圧・脂質異常で定期的に服薬中の場合
以下告知項目に該当しませんが、契約3ヶ月後に直接的な原因により脳梗塞が発症した場合などはお支払い出来ないことがあります。</p><p class="text-caption text-neutral-600 leading-relaxed whitespace-pre-line">※ただし、以下のような場合には責任開始期以後発生した原因によるものとみなし、保険金・給付金をお支払いします。</p><ul class="space-y-2"><li class="flex gap-2 text-caption text-neutral-600 leading-relaxed"><span class="text-neutral-400 shrink-0">・</span><span class="whitespace-pre-line">責任開始期から2年を経過した後で支払事由が生じた場合</span></li><li class="flex gap-2 text-caption text-neutral-600 leading-relaxed"><span class="text-neutral-400 shrink-0">・</span><span class="whitespace-pre-line">責任開始期以降、その疾病やケガによって医師の診察を受けたことがなく、かつ診断等による異常な指摘も受けていない場合。ただし、その原因となった病気やケガによる症状について被保険者が認識または自覚していた場合を除きます。</span></li></ul><div class="rounded-xl px-4 py-3 flex items-start gap-2" style="background:#F0F7FF;border:1px solid #C8DCFA"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="w-4 h-4 shrink-0 mt-[2px]" style="color:var(--color-primary)"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5"></path><path d="M12 16v.01"></path></svg><p class="text-caption leading-relaxed" style="color:#054EBA">各質問に対して<strong>「はい」に当てはまる場合はお申し込みいただけません。</strong></p></div><div class="space-y-3"><div class="pt-8"><p class="text-h5 font-bold text-neutral-800 leading-snug">告知重要事項</p><p class="text-caption text-neutral-600 leading-relaxed mt-1">各項目をご確認のうえ、以下の内容にご回答ください。</p></div><p class="text-[11px] font-bold text-neutral-500 pt-1 pb-[2px] border-b border-warm-200">最近の健康状態</p><div class="rounded-xl border border-warm-200 bg-white overflow-hidden"><div class="px-3 pt-3 pb-3 space-y-2"><div><p class="text-caption leading-relaxed text-neutral-700"><strong class="font-bold text-neutral-900 text-[14px]">最近3ヶ月以内に、医師より検査・入院・手術を勧められたことがありますか。（検査には、健康診断、人間ドック、歯科検査、アレルギー検査を含みません）</strong></p></div></div></div><p class="text-[11px] font-bold text-neutral-500 pt-1 pb-[2px] border-b border-warm-200">病気・ケガについて</p><div class="rounded-xl border border-warm-200 bg-white overflow-hidden"><div class="px-3 pt-3 pb-3 space-y-2"><div><p class="text-caption leading-relaxed text-neutral-700"><strong class="font-bold text-neutral-900 text-[14px]">過去5年以内に別表の病気で、医師による診療・検査・治療・薬の処方を受けたことがありますか。</strong></p><div class="mt-2 rounded-lg border border-warm-200 overflow-hidden"><div class="grid grid-cols-[88px_1fr] "><div class="bg-warm-100 px-2 py-2 flex items-center border-r border-warm-200"><span class="text-[11px] font-bold text-neutral-600 leading-snug">心臓・血液</span></div><div class="px-2 py-2 text-[11px] text-neutral-700 leading-relaxed">狭心症、心筋梗塞、心臓弁膜症、不整脈、心筋症、心不全、大動脈瘤</div></div><div class="grid grid-cols-[88px_1fr] border-t border-warm-200"><div class="bg-warm-100 px-2 py-2 flex items-center border-r border-warm-200"><span class="text-[11px] font-bold text-neutral-600 leading-snug">脳</span></div><div class="px-2 py-2 text-[11px] text-neutral-700 leading-relaxed">脳卒中（脳出血、脳梗塞、くも膜下出血）、脳動脈瘤、脳しゅよう</div></div><div class="grid grid-cols-[88px_1fr] border-t border-warm-200"><div class="bg-warm-100 px-2 py-2 flex items-center border-r border-warm-200"><span class="text-[11px] font-bold text-neutral-600 leading-snug">精神・神経</span></div><div class="px-2 py-2 text-[11px] text-neutral-700 leading-relaxed">認知症、うつ病、統合失調症、アルコール依存症、てんかん、パーキンソン病、脊髄小脳変性症、多系統萎縮症、筋萎縮性側索硬化症、多発性硬化症</div></div><div class="grid grid-cols-[88px_1fr] border-t border-warm-200"><div class="bg-warm-100 px-2 py-2 flex items-center border-r border-warm-200"><span class="text-[11px] font-bold text-neutral-600 leading-snug">肝臓・腎臓・膵臓</span></div><div class="px-2 py-2 text-[11px] text-neutral-700 leading-relaxed">慢性肝炎、肝硬変、慢性腎炎、ネフローゼ、腎不全、すい炎</div></div><div class="grid grid-cols-[88px_1fr] border-t border-warm-200"><div class="bg-warm-100 px-2 py-2 flex items-center border-r border-warm-200"><span class="text-[11px] font-bold text-neutral-600 leading-snug">肺</span></div><div class="px-2 py-2 text-[11px] text-neutral-700 leading-relaxed">肺気腫、閉塞性肺疾患、間質性肺炎、誤嚥性肺炎</div></div><div class="grid grid-cols-[88px_1fr] border-t border-warm-200"><div class="bg-warm-100 px-2 py-2 flex items-center border-r border-warm-200"><span class="text-[11px] font-bold text-neutral-600 leading-snug">目</span></div><div class="px-2 py-2 text-[11px] text-neutral-700 leading-relaxed">緑内障、加齢黄斑変性症、網膜色素変性症</div></div><div class="grid grid-cols-[88px_1fr] border-t border-warm-200"><div class="bg-warm-100 px-2 py-2 flex items-center border-r border-warm-200"><span class="text-[11px] font-bold text-neutral-600 leading-snug">悪性新生物</span></div><div class="px-2 py-2 text-[11px] text-neutral-700 leading-relaxed">がん、肉腫、悪性の腫瘍、白血病、悪性リンパ腫、骨髄腫、骨髄異形成症候群</div></div><div class="grid grid-cols-[88px_1fr] border-t border-warm-200"><div class="bg-warm-100 px-2 py-2 flex items-center border-r border-warm-200"><span class="text-[11px] font-bold text-neutral-600 leading-snug">その他</span></div><div class="px-2 py-2 text-[11px] text-neutral-700 leading-relaxed">合併症を伴う糖尿病、膠原病（関節リウマチ、全身性エリテマトーデス（SLE）、強皮症、多発性筋炎、結節性多発動脈周囲炎）</div></div></div></div></div></div><p class="text-[11px] font-bold text-neutral-500 pt-1 pb-[2px] border-b border-warm-200">身体の障がい・介護状態について</p><div class="rounded-xl border border-warm-200 bg-white overflow-hidden"><div class="px-3 pt-3 pb-3 space-y-2"><div><p class="text-caption leading-relaxed text-neutral-700"><strong class="font-bold text-neutral-900 text-[14px]">つぎのいずれか1つでも該当することはありますか。</strong></p></div><div><p class="text-caption leading-relaxed text-neutral-700"><span>●今までに、公的介護保険制度の要介護または要支援の認定を受けていたこと、もしくは、認定申請をしたことがある（40歳未満の方は該当しません）</span></p></div><div><p class="text-caption leading-relaxed text-neutral-700"><span>●現在、つぎの1〜5の日常生活のいずれかにおいて、他の方の介助またはご自身で補助具を必要とすることがある。＊骨折中などにより現在一時的に必要とする場合も含みます。＜1.歩行 2.衣服の着替え 3.入浴 4.食事 5.排泄＞</span></p></div></div></div></div></div><div class="px-6 py-3 border-t border-warm-200"><div class="space-y-2"><div class="grid grid-cols-2 gap-x-3 gap-y-6"><button class="flex flex-col items-center justify-center gap-[2px] rounded-xl py-3 font-bold border-2 transition-colors" style="bo  aria-invalid:border-destructive fld h-12 rounded-lg border px-3 placeholder:text-neutral-400 border-warm-300 bg-white text-neutral-800" id="_R_3e53mlubsnubrb_" placeholder="1234567891234567"/></div><span class="text-caption text-neutral-400">任意コード：0000000000000000<br/>団体からご案内のコードを入力してください</span></div></div></div><div class="sticky bottom-0 z-20 backdrop-blur border-t px-6 py-3 space-y-2 transition-colors duration-300 bg-white/95 border-warm-200"><div class="rounded-xl border px-4 py-2 transition-colors border-warm-200 bg-white"><div class="flex items-center justify-between gap-2"><span class="font-mono text-[10px] tracking-[0.14em] uppercase text-neutral-400">保険内容</span><button class="flex items-center gap-1 text-caption font-medium" style="color:var(--color-link)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-4 h-4"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>修正</button></div><div class="mt-[2px] flex items-center flex-wrap gap-x-2 gap-y-[2px] text-caption"><span class="font-bold text-neutral-800">がん保障型　死亡保障あり</span><span class="text-warm-300">|</span><span class="text-neutral-700 tabular-nums">10,000<!-- -->円/月</span><span class="text-warm-300">|</span><span class="text-neutral-700 tabular-nums">15<!-- -->年</span></div></div><div class="flex items-center justify-center gap-3"><button class="text-caption font-medium shrink-0 px-1" style="color:var(--color-link)">← 戻る</button><div style="width:100%;max-width:260px"><button data-slot="button" class="inline-flex items-center justify-center whitespace-nowrap text-sm transition-colors duration-200 ease-out disabled:pointer-events-none disabled:opacity-50 [&amp;_svg]:pointer-events-none [&amp;_svg:not([class*=&#x27;size-&#x27;])]:size-4 shrink-0 [&amp;_svg]:shrink-0 outline-none focus-visible:border-ring focus-visible:ring-ring/50 focus-visible:ring-[3px] aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 aria-invalid:border-destructive bg-primary shadow-xs hover:bg-button-primary-hover py-2 has-[&gt;svg]:px-3 h-16 md:h-16 rounded-xl gap-2 px-4 font-bold active:scale-[.99] text-white w-full" type="button" style="background-image:linear-gradient(135deg, #075FE3 0%, #64B0F7 100%)">入力内容を確認する<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><path d="M9 18l6-6-6-6"></path></svg></button></div></div></div><div class="absolute inset-0 z-50"><div class="absolute inset-0 bg-black/40 fade-in"></div><div class="sheet-up absolute left-0 right-0 bottom-0 bg-white rounded-t-2xl shadow-xl max-h-[88%] flex flex-col"><div class="flex items-center justify-between gap-2 px-6 pt-4 pb-3 border-b border-warm-200"><h3 class="flex items-center gap-2 text-h6 font-bold text-neutral-800 min-w-0"><span class="grid place-items-center w-6 h-6 rounded-full shrink-0 text-white" style="background:var(--color-attention)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" class="w-3 h-3"><path d="M12 6v8"></path><path d="M12 18v.01"></path></svg></span><span>がん保障型<!-- -->　死亡保障<!-- -->あり<!-- -->の告知項目</span></h3><button class="grid place-items-center w-8 h-8 rounded-full bg-warm-100 text-neutral-500 shrink-0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="w-4 h-4"><path d="M18 6L6 18M6 6l12 12"></path></svg></button></div><div class="flex-1 overflow-y-auto no-sb px-4 py-4 space-y-3"><p class="text-h5 font-bold text-neutral-800 leading-snug pt-1">告知に関する重要事項</p><p class="text-caption text-neutral-600 leading-relaxed whitespace-pre-line">下記の内容をご確認のうえ、お申し込みください。</p><p class="text-caption font-bold text-neutral-800 leading-relaxed">保険商品お申し込みの方へ</p><p class="text-caption text-neutral-600 leading-relaxed whitespace-pre-line">募集用資料・告知書・告知説明資料等において、ご契約者や被保険者は健康状態等について告知をしていただく義務があります。</p><p class="text-caption text-neutral-600 leading-relaxed whitespace-pre-line">生命保険は、多数の人々が公平に保険料を出し合い、相互に保険し合う制度です。したがって、初めから健康状態の良くない方や危険な職業に従事されている方等が無条件に契約されますと、保険料負担の公平性が保てません。</p><p class="text-caption text-neutral-600 leading-relaxed whitespace-pre-line">ご契約にあたっては、過去の傷病歴（傷病名・治療期間等）、現在の健康状態、身体の障がい状態、職業歴とうについて「告知書」で当社がおたずねすることについて、事実をありのままに正確にもれなくお知らせ（告知）ください</p><p class="text-caption text-neutral-600 leading-relaxed whitespace-pre-line">ご契約（責任開始期）前に生じた病気やケガにより、支払事由が生じた場合には、保険金・給付金はお支払い出来ません。（事例）契約前より高血圧・脂質異常で定期的に服薬中の場合
以下告知項目に該当しませんが、契約3ヶ月後に直接的な原因により脳梗塞が発症した場合などはお支払い出来ないことがあります。</p><p class="text-caption text-neutral-600 leading-relaxed whitespace-pre-line">※ただし、以下のような場合には責任開始期以後発生した原因によるものとみなし、保険金・給付金をお支払いします。</p><ul class="space-y-2"><li class="flex gap-2 text-caption text-neutral-600 leading-relaxed"><span class="text-neutral-400 shrink-0">・</span><span class="whitespace-pre-line">責任開始期から2年を経過した後で支払事由が生じた場合</span></li><li class="flex gap-2 text-caption text-neutral-600 leading-relaxed"><span class="text-neutral-400 shrink-0">・</span><span class="whitespace-pre-line">責任開始期以降、その疾病やケガによって医師の診察を受けたことがなく、かつ診断等による異常な指摘も受けていない場合。ただし、その原因となった病気やケガによる症状について被保険者が認識または自覚していた場合を除きます。</span></li></ul><div class="rounded-xl px-4 py-3 flex items-start gap-2" style="background:#F0F7FF;border:1px solid #C8DCFA"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="w-4 h-4 shrink-0 mt-[2px]" style="color:var(--color-primary)"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5"></path><path d="M12 16v.01"></path></svg><p class="text-caption leading-relaxed" style="color:#054EBA">各質問に対して<strong>「はい」に当てはまる場合はお申し込みいただけません。</strong></p></div><div class="space-y-3"><div class="pt-8"><p class="text-h5 font-bold text-neutral-800 leading-snug">告知重要事項</p><p class="text-caption text-neutral-600 leading-relaxed mt-1">各項目をご確認のうえ、以下の内容にご回答ください。</p></div><p class="text-[11px] font-bold text-neutral-500 pt-1 pb-[2px] border-b border-warm-200">最近の健康状態</p><div class="rounded-xl border border-warm-200 bg-white overflow-hidden"><div class="px-3 pt-3 pb-3 space-y-2"><div><p class="text-caption leading-relaxed text-neutral-700"><strong class="font-bold text-neutral-900 text-[14px]">最近3ヶ月以内に、医師より検査・入院・手術を勧められたことがありますか。（検査には、健康診断、人間ドック、歯科検査、アレルギー検査を含みません）</strong></p></div></div></div><p class="text-[11px] font-bold text-neutral-500 pt-1 pb-[2px] border-b border-warm-200">病気・ケガについて</p><div class="rounded-xl border border-warm-200 bg-white overflow-hidden"><div class="px-3 pt-3 pb-3 space-y-2"><div><p class="text-caption leading-relaxed text-neutral-700"><strong class="font-bold text-neutral-900 text-[14px]">過去5年以内に別表の病気で、医師による診療・検査・治療・薬の処方を受けたことがありますか。</strong></p><div class="mt-2 rounded-lg border border-warm-200 overflow-hidden"><div class="grid grid-cols-[88px_1fr] "><div class="bg-warm-100 px-2 py-2 flex items-center border-r border-warm-200"><span class="text-[11px] font-bold text-neutral-600 leading-snug">心臓・血液</span></div><div class="px-2 py-2 text-[11px] text-neutral-700 leading-relaxed">狭心症、心筋梗塞、心臓弁膜症、不整脈、心筋症、心不全、大動脈瘤</div></div><div class="grid grid-cols-[88px_1fr] border-t border-warm-200"><div class="bg-warm-100 px-2 py-2 flex items-center border-r border-warm-200"><span class="text-[11px] font-bold text-neutral-600 leading-snug">脳</span></div><div class="px-2 py-2 text-[11px] text-neutral-700 leading-relaxed">脳卒中（脳出血、脳梗塞、くも膜下出血）、脳動脈瘤、脳しゅよう</div></div><div class="grid grid-cols-[88px_1fr] border-t border-warm-200"><div class="bg-warm-100 px-2 py-2 flex items-center border-r border-warm-200"><span class="text-[11px] font-bold text-neutral-600 leading-snug">精神・神経</span></div><div class="px-2 py-2 text-[11px] text-neutral-700 leading-relaxed">認知症、うつ病、統合失調症、アルコール依存症、てんかん、パーキンソン病、脊髄小脳変性症、多系統萎縮症、筋萎縮性側索硬化症、多発性硬化症</div></div><div class="grid grid-cols-[88px_1fr] border-t border-warm-200"><div class="bg-warm-100 px-2 py-2 flex items-center border-r border-warm-200"><span class="text-[11px] font-bold text-neutral-600 leading-snug">肝臓・腎臓・膵臓</span></div><div class="px-2 py-2 text-[11px] text-neutral-700 leading-relaxed">慢性肝炎、肝硬変、慢性腎炎、ネフローゼ、腎不全、すい炎</div></div><div class="grid grid-cols-[88px_1fr] border-t border-warm-200"><div class="bg-warm-100 px-2 py-2 flex items-center border-r border-warm-200"><span class="text-[11px] font-bold text-neutral-600 leading-snug">肺</span></div><div class="px-2 py-2 text-[11px] text-neutral-700 leading-relaxed">肺気腫、閉塞性肺疾患、間質性肺炎、誤嚥性肺炎</div></div><div class="grid grid-cols-[88px_1fr] border-t border-warm-200"><div class="bg-warm-100 px-2 py-2 flex items-center border-r border-warm-200"><span class="text-[11px] font-bold text-neutral-600 leading-snug">目</span></div><div class="px-2 py-2 text-[11px] text-neutral-700 leading-relaxed">—</div></div><div class="grid grid-cols-[88px_1fr] border-t border-warm-200"><div class="bg-warm-100 px-2 py-2 flex items-center border-r border-warm-200"><span class="text-[11px] font-bold text-neutral-600 leading-snug">悪性新生物</span></div><div class="px-2 py-2 text-[11px] text-neutral-700 leading-relaxed">がん、肉腫、悪性の腫瘍、白血病、悪性リンパ腫、骨髄腫、骨髄異形成症候群</div></div><div class="grid grid-cols-[88px_1fr] border-t border-warm-200"><div class="bg-warm-100 px-2 py-2 flex items-center border-r border-warm-200"><span class="text-[11px] font-bold text-neutral-600 leading-snug">その他</span></div><div class="px-2 py-2 text-[11px] text-neutral-700 leading-relaxed">合併症を伴う糖尿病、膠原病（関節リウマチ、全身性エリテマトーデス（SLE）、強皮症、多発性筋炎、結節性多発動脈周囲炎）</div></div></div></div><div><p class="text-caption leading-relaxed text-neutral-700"><strong class="font-bold text-neutral-900 text-[14px]">過去5年以内に、病気で継続して7日以上の入院をしたことまたは手術を受けたことがありますか。（新型コロナウイルスによる入院は含みません。）</strong></p></div></div></div><p class="text-[11px] font-bold text-neutral-500 pt-1 pb-[2px] border-b border-warm-200">がんについて</p><div class="rounded-xl border border-warm-200 bg-white overflow-hidden"><div class="px-3 pt-3 pb-3 space-y-2"><div><p class="text-caption leading-relaxed text-neutral-700"><strong class="font-bold text-neutral-900 text-[14px]">今までに、がん（上皮内がんを含みます）・肉腫・悪性リンパ腫・白血病にかかったこと、または上皮内異形成になったことがありますか。</strong></p></div></div></div><p class="text-[11px] font-bold text-neutral-500 pt-1 pb-[2px] border-b border-warm-200">健康診断・人間ドックについて</p><div class="rounded-xl border border-warm-200 bg-white overflow-hidden"><div class="px-3 pt-3 pb-3 space-y-2"><div><p class="text-caption leading-relaxed text-neutral-700"><strong class="font-bold text-neutral-900 text-[14px]">過去2年以内に健康診断・人間ドックにおいて、以下の検査を受けて、異常の指摘を受けたことがありますか。</strong></p></div><div><p class="text-caption leading-relaxed text-neutral-700"><span>異常とは、要再検査・要精密検査・要治療をいいます。ただし、再検査・精密検査の結果、「異常なし」と診断された場合を除きます。</span></p></div><div class="space-y-1 pt-[2px]"><p class="text-caption font-bold text-neutral-800">『内視鏡検査・便潜血検査・マンモグラフィ検査』</p><p class="text-caption font-bold text-neutral-800">『しゅようマーカー（CEA、AFP、CA19-9、PSA）』</p></div></div></div></div></div><div class="px-6 py-3 border-t border-warm-200"><div class="space-y-2"><div class="grid grid-cols-2 gap-x-3 gap-y-6"><button class="flex flex-col items-center justify-center gap-[2px] rounded-xl py-3 font-bold border-2 transition-colors" style="border-color:var(--color-attention);color:var(--color-attention);background:#FFF5F5"><span class="flex items-center gap-2 text-h6 font-bold"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" class="w-4 h-4"><path d="M18 6L6 18M6 6l12 12"></path></svg>はい</span><span class="text-[10px] font-medium leading-tight" style="color:var(--color-attention)">１つでも存在する</span></button><button class="flex flex-col items-center justify-center gap-[2px] rounded-xl py-3 font-bold border-2 transition-colors" style="border-color:#16A34A;color:#16A34A;background:#F0FDF4"><span class="flex items-center gap-2 text-h6 font-bold"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" class="w-4 h-4"><path d="M5 12l5 5L19 7"></path></svg>いいえ</span><span class="text-[10px] font-medium leading-tight" style="color:#16A34A">すべていいえ</span></button></div><p class="text-center text-[11px] text-neutral-400">すべての項目が「いいえ」の場合に進めます</p></div></div></div></div></div></div></figure><figure class="flex flex-col items-start gap-2" style="width:390px"><figcaption class="flex items-center gap-2"><p class="text-h6 font-semibold text-foreground">④ がんプラン（死亡なし）</p><a href="/theo-tdf-view?s=3&amp;disclosure=1&amp;kokuchiPattern=cancer_n" target="_blank" rel="noopener noreferrer" class="inline-flex items-cent olor" stroke-width="2" stroke-linecap="round" class="w-4 h-4"><path d="M18 6L6 18M6 6l12 12"></path></svg></button></div><div class="flex-1 overflow-y-auto no-sb px-4 py-4 space-y-3"><p class="text-h5 font-bold text-neutral-800 leading-snug pt-1">告知に関する重要事項</p><p class="text-caption text-neutral-600 leading-relaxed whitespace-pre-line">下記の内容をご確認のうえ、お申し込みください。</p><p class="text-caption font-bold text-neutral-800 leading-relaxed">保険商品お申し込みの方へ</p><p class="text-caption text-neutral-600 leading-relaxed whitespace-pre-line">募集用資料・告知書・告知説明資料等において、ご契約者や被保険者は健康状態等について告知をしていただく義務があります。</p><p class="text-caption text-neutral-600 leading-relaxed whitespace-pre-line">生命保険は、多数の人々が公平に保険料を出し合い、相互に保険し合う制度です。したがって、初めから健康状態の良くない方や危険な職業に従事されている方等が無条件に契約されますと、保険料負担の公平性が保てません。</p><p class="text-caption text-neutral-600 leading-relaxed whitespace-pre-line">ご契約にあたっては、過去の傷病歴（傷病名・治療期間等）、現在の健康状態、身体の障がい状態、職業歴とうについて「告知書」で当社がおたずねすることについて、事実をありのままに正確にもれなくお知らせ（告知）ください</p><p class="text-caption text-neutral-600 leading-relaxed whitespace-pre-line">ご契約（責任開始期）前に生じた病気やケガにより、支払事由が生じた場合には、保険金・給付金はお支払い出来ません。（事例）契約前より高血圧・脂質異常で定期的に服薬中の場合
以下告知項目に該当しませんが、契約3ヶ月後に直接的な原因により脳梗塞が発症した場合などはお支払い出来ないことがあります。</p><p class="text-caption text-neutral-600 leading-relaxed whitespace-pre-line">※ただし、以下のような場合には責任開始期以後発生した原因によるものとみなし、保険金・給付金をお支払いします。</p><ul class="space-y-2"><li class="flex gap-2 text-caption text-neutral-600 leading-relaxed"><span class="text-neutral-400 shrink-0">・</span><span class="whitespace-pre-line">責任開始期から2年を経過した後で支払事由が生じた場合</span></li><li class="flex gap-2 text-caption text-neutral-600 leading-relaxed"><span class="text-neutral-400 shrink-0">・</span><span class="whitespace-pre-line">責任開始期以降、その疾病やケガによって医師の診察を受けたことがなく、かつ診断等による異常な指摘も受けていない場合。ただし、その原因となった病気やケガによる症状について被保険者が認識または自覚していた場合を除きます。</span></li></ul><div class="rounded-xl px-4 py-3 flex items-start gap-2" style="background:#F0F7FF;border:1px solid #C8DCFA"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="w-4 h-4 shrink-0 mt-[2px]" style="color:var(--color-primary)"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5"></path><path d="M12 16v.01"></path></svg><p class="text-caption leading-relaxed" style="color:#054EBA">各質問に対して<strong>「はい」に当てはまる場合はお申し込みいただけません。</strong></p></div><div class="space-y-3"><div class="pt-8"><p class="text-h5 font-bold text-neutral-800 leading-snug">告知重要事項</p><p class="text-caption text-neutral-600 leading-relaxed mt-1">各項目をご確認のうえ、以下の内容にご回答ください。</p></div><p class="text-[11px] font-bold text-neutral-500 pt-1 pb-[2px] border-b border-warm-200">最近の健康状態</p><div class="rounded-xl border border-warm-200 bg-white overflow-hidden"><div class="px-3 pt-3 pb-3 space-y-2"><div><p class="text-caption leading-relaxed text-neutral-700"><strong class="font-bold text-neutral-900 text-[14px]">最近3ヶ月以内に、医師より検査・入院・手術を勧められたことがありますか。（検査には、健康診断、人間ドック、歯科検査、アレルギー検査を含みません）</strong></p></div></div></div><p class="text-[11px] font-bold text-neutral-500 pt-1 pb-[2px] border-b border-warm-200">病気・ケガについて</p><div class="rounded-xl border border-warm-200 bg-white overflow-hidden"><div class="px-3 pt-3 pb-3 space-y-2"><div><p class="text-caption leading-relaxed text-neutral-700"><strong class="font-bold text-neutral-900 text-[14px]">過去5年以内に、病気で継続して7日以上の入院をしたことまたは手術を受けたことがありますか。（新型コロナウイルスによる入院は含みません。）</strong></p></div></div></div><p class="text-[11px] font-bold text-neutral-500 pt-1 pb-[2px] border-b border-warm-200">がんについて</p><div class="rounded-xl border border-warm-200 bg-white overflow-hidden"><div class="px-3 pt-3 pb-3 space-y-2"><div><p class="text-caption leading-relaxed text-neutral-700"><strong class="font-bold text-neutral-900 text-[14px]">今までに、がん（上皮内がんを含みます）・肉腫・悪性リンパ腫・白血病にかかったこと、または上皮内異形成になったことがありますか。</strong></p></div></div></div><p class="text-[11px] font-bold text-neutral-500 pt-1 pb-[2px] border-b border-warm-200">健康診断・人間ドックについて</p><div class="rounded-xl border border-warm-200 bg-white overflow-hidden"><div class="px-3 pt-3 pb-3 space-y-2"><div><p class="text-caption leading-relaxed text-neutral-700"><strong class="font-bold text-neutral-900 text-[14px]">過去2年以内に健康診断・人間ドックにおいて、以下の検査を受けて、異常の指摘を受けたことがありますか。</strong></p></div><div><p class="text-caption leading-relaxed text-neutral-700"><span>異常とは、要再検査・要精密検査・要治療をいいます。ただし、再検査・精密検査の結果、「異常なし」と診断された場合を除きます。</span></p></div><div class="space-y-1 pt-[2px]"><p class="text-caption font-bold text-neutral-800">『内視鏡検査・便潜血検査・マンモグラフィ検査』</p><p class="text-caption font-bold text-neutral-800">『しゅようマーカー（CEA、AFP、CA19-9、PSA）』</p></div></div></div></div></div><div class="px-6 py-3 border-t border-warm-200"><div class="space-y-2"><div class="grid grid-cols-2 gap-x-3 gap-y-6"><button class="flex flex-col items-center justify-center gap-[2px] rounded-xl py-3 font-bold border-2 transition-colors" style="border-color:var(--color-attention);color:var(--color-attention);background:#FFF5F5"><span class="flex items-center gap-2 text-h6 font-bold"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" class="w-4 h-4"><path d="M18 6L6 18M6 6l12 12"></path></svg>はい</span><span class="text-[10px] font-medium leading-tight" style="color:var(--color-attention)">１つでも存在する</span></button><button class="flex flex-col items-center justify-center gap-[2px] rounded-xl py-3 font-bold border-2 transition-colors" style="border-color:#16A34A;color:#16A34A;background:#F0FDF4"><span class="flex items-center gap-2 text-h6 font-bold"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" class="w-4 h-4"><path d="M5 12l5 5L19 7"></path></svg>いいえ</span><span class="text-[10px] font-medium leading-tight" style="color:#16A34A">すべていいえ</span></button></div><p class="text-center text-[11px] text-neutral-400">すべての項目が「いいえ」の場合に進めます</p></div></div></div></div></div></div></figure><figure class="flex flex-col items-start gap-2" style="width:390px"><figcaption class="flex items-center gap-2"><p class="text-h6 font-semibold text-foreground">⑤ がん・障害介護プラン（死亡あり）</p><a href="/theo-tdf-view?s=3&amp;disclosure=1&amp;kokuchiPattern=cc_d" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 rounded-full border border-warm-300 bg-white px-2 py-0.5 text-[10px] font-medium text-neutral-400 shadow-sm hover:border-primary hover:text-primary transition-colors shrink-0">HTML <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-3 h-3 shrink-0"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg></a></figcaption><div class="theo-tdf-cd font-jp screen-flat relative rounded-2xl border border-warm-200 bg-warm-50 shadow-sm overflow-visible" style="width:390px;min-height:693px"><div class="flex flex-col"><div class="sticky top-0 z-20 text-primary-foreground" style="background-image:linear-gradient(135deg, #075FE3 0%, #64B0F7 100%);background-size:100% 89px;background-repeat:no-repeat;background-position:0 -33px"><div class=" e" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><path d="M9 18l6-6-6-6"></path></svg></button></div></div></div><div class="absolute inset-0 z-50"><div class="absolute inset-0 bg-black/40 fade-in"></div><div class="sheet-up absolute left-0 right-0 bottom-0 bg-white rounded-t-2xl shadow-xl max-h-[88%] flex flex-col"><div class="flex items-center justify-between gap-2 px-6 pt-4 pb-3 border-b border-warm-200"><h3 class="flex items-center gap-2 text-h6 font-bold text-neutral-800 min-w-0"><span class="grid place-items-center w-6 h-6 rounded-full shrink-0 text-white" style="background:var(--color-attention)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" class="w-3 h-3"><path d="M12 6v8"></path><path d="M12 18v.01"></path></svg></span><span>がん・障害介護保障型<!-- -->　死亡保障<!-- -->あり<!-- -->の告知項目</span></h3><button class="grid place-items-center w-8 h-8 rounded-full bg-warm-100 text-neutral-500 shrink-0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="w-4 h-4"><path d="M18 6L6 18M6 6l12 12"></path></svg></button></div><div class="flex-1 overflow-y-auto no-sb px-4 py-4 space-y-3"><p class="text-h5 font-bold text-neutral-800 leading-snug pt-1">告知に関する重要事項</p><p class="text-caption text-neutral-600 leading-relaxed whitespace-pre-line">下記の内容をご確認のうえ、お申し込みください。</p><p class="text-caption font-bold text-neutral-800 leading-relaxed">保険商品お申し込みの方へ</p><p class="text-caption text-neutral-600 leading-relaxed whitespace-pre-line">募集用資料・告知書・告知説明資料等において、ご契約者や被保険者は健康状態等について告知をしていただく義務があります。</p><p class="text-caption text-neutral-600 leading-relaxed whitespace-pre-line">生命保険は、多数の人々が公平に保険料を出し合い、相互に保険し合う制度です。したがって、初めから健康状態の良くない方や危険な職業に従事されている方等が無条件に契約されますと、保険料負担の公平性が保てません。</p><p class="text-caption text-neutral-600 leading-relaxed whitespace-pre-line">ご契約にあたっては、過去の傷病歴（傷病名・治療期間等）、現在の健康状態、身体の障がい状態、職業歴とうについて「告知書」で当社がおたずねすることについて、事実をありのままに正確にもれなくお知らせ（告知）ください</p><p class="text-caption text-neutral-600 leading-relaxed whitespace-pre-line">ご契約（責任開始期）前に生じた病気やケガにより、支払事由が生じた場合には、保険金・給付金はお支払い出来ません。（事例）契約前より高血圧・脂質異常で定期的に服薬中の場合
以下告知項目に該当しませんが、契約3ヶ月後に直接的な原因により脳梗塞が発症した場合などはお支払い出来ないことがあります。</p><p class="text-caption text-neutral-600 leading-relaxed whitespace-pre-line">※ただし、以下のような場合には責任開始期以後発生した原因によるものとみなし、保険金・給付金をお支払いします。</p><ul class="space-y-2"><li class="flex gap-2 text-caption text-neutral-600 leading-relaxed"><span class="text-neutral-400 shrink-0">・</span><span class="whitespace-pre-line">責任開始期から2年を経過した後で支払事由が生じた場合</span></li><li class="flex gap-2 text-caption text-neutral-600 leading-relaxed"><span class="text-neutral-400 shrink-0">・</span><span class="whitespace-pre-line">責任開始期以降、その疾病やケガによって医師の診察を受けたことがなく、かつ診断等による異常な指摘も受けていない場合。ただし、その原因となった病気やケガによる症状について被保険者が認識または自覚していた場合を除きます。</span></li></ul><div class="rounded-xl px-4 py-3 flex items-start gap-2" style="background:#F0F7FF;border:1px solid #C8DCFA"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="w-4 h-4 shrink-0 mt-[2px]" style="color:var(--color-primary)"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5"></path><path d="M12 16v.01"></path></svg><p class="text-caption leading-relaxed" style="color:#054EBA">各質問に対して<strong>「はい」に当てはまる場合はお申し込みいただけません。</strong></p></div><div class="space-y-3"><div class="pt-8"><p class="text-h5 font-bold text-neutral-800 leading-snug">告知重要事項</p><p class="text-caption text-neutral-600 leading-relaxed mt-1">各項目をご確認のうえ、以下の内容にご回答ください。</p></div><p class="text-[11px] font-bold text-neutral-500 pt-1 pb-[2px] border-b border-warm-200">最近の健康状態</p><div class="rounded-xl border border-warm-200 bg-white overflow-hidden"><div class="px-3 pt-3 pb-3 space-y-2"><div><p class="text-caption leading-relaxed text-neutral-700"><strong class="font-bold text-neutral-900 text-[14px]">最近3ヶ月以内に、医師より検査・入院・手術を勧められたことがありますか。（検査には、健康診断、人間ドック、歯科検査、アレルギー検査を含みません）</strong></p></div></div></div><p class="text-[11px] font-bold text-neutral-500 pt-1 pb-[2px] border-b border-warm-200">病気・ケガについて</p><div class="rounded-xl border border-warm-200 bg-white overflow-hidden"><div class="px-3 pt-3 pb-3 space-y-2"><div><p class="text-caption leading-relaxed text-neutral-700"><strong class="font-bold text-neutral-900 text-[14px]">過去5年以内に別表の病気で、医師による診療・検査・治療・薬の処方を受けたことがありますか。</strong></p><div class="mt-2 rounded-lg border border-warm-200 overflow-hidden"><div class="grid grid-cols-[88px_1fr] "><div class="bg-warm-100 px-2 py-2 flex items-center border-r border-warm-200"><span class="text-[11px] font-bold text-neutral-600 leading-snug">心臓・血液</span></div><div class="px-2 py-2 text-[11px] text-neutral-700 leading-relaxed">狭心症、心筋梗塞、心臓弁膜症、不整脈、心筋症、心不全、大動脈瘤</div></div><div class="grid grid-cols-[88px_1fr] border-t border-warm-200"><div class="bg-warm-100 px-2 py-2 flex items-center border-r border-warm-200"><span class="text-[11px] font-bold text-neutral-600 leading-snug">脳</span></div><div class="px-2 py-2 text-[11px] text-neutral-700 leading-relaxed">脳卒中（脳出血、脳梗塞、くも膜下出血）、脳動脈瘤、脳しゅよう</div></div><div class="grid grid-cols-[88px_1fr] border-t border-warm-200"><div class="bg-warm-100 px-2 py-2 flex items-center border-r border-warm-200"><span class="text-[11px] font-bold text-neutral-600 leading-snug">精神・神経</span></div><div class="px-2 py-2 text-[11px] text-neutral-700 leading-relaxed">認知症、うつ病、統合失調症、アルコール依存症、てんかん、パーキンソン病、脊髄小脳変性症、多系統萎縮症、筋萎縮性側索硬化症、多発性硬化症</div></div><div class="grid grid-cols-[88px_1fr] border-t border-warm-200"><div class="bg-warm-100 px-2 py-2 flex items-center border-r border-warm-200"><span class="text-[11px] font-bold text-neutral-600 leading-snug">肝臓・腎臓・膵臓</span></div><div class="px-2 py-2 text-[11px] text-neutral-700 leading-relaxed">慢性肝炎、肝硬変、慢性腎炎、ネフローゼ、腎不全、すい炎</div></div><div class="grid grid-cols-[88px_1fr] border-t border-warm-200"><div class="bg-warm-100 px-2 py-2 flex items-center border-r border-warm-200"><span class="text-[11px] font-bold text-neutral-600 leading-snug">肺</span></div><div class="px-2 py-2 text-[11px] text-neutral-700 leading-relaxed">肺気腫、閉塞性肺疾患、間質性肺炎、誤嚥性肺炎</div></div><div class="grid grid-cols-[88px_1fr] border-t border-warm-200"><div class="bg-warm-100 px-2 py-2 flex items-center border-r border-warm-200"><span class="text-[11px] font-bold text-neutral-600 leading-snug">目</span></div><div class="px-2 py-2 text-[11px] text-neutral-700 leading-relaxed">緑内障、加齢黄斑変性症、網膜色素変性症</div></div><div class="grid grid-cols-[88px_1fr] border-t border-warm-200"><div class="bg-warm-100 px-2 py-2 flex items-center border-r border-warm-200"><span class="text-[11px] font-bold text-neutral-600 leading-snug">悪性新生物</span></div><div class="px-2 py-2 text-[11px] text-neutral-700 leading-relaxed">がん、肉腫、悪性の腫瘍、白血病、悪性リンパ腫、骨髄腫、骨髄異形成症候群</div></div><div class="grid grid-cols-[88px_1fr] border-t border-warm-200"><div class="bg-warm-100 px-2 py-2 flex items-center border-r border-warm-200"><span class="text-[11px] font-bold text-neutral-600 leading-snug">その他</span></div><div class="px-2 py-2 text-[11px] text-neutral-700 leading-relaxed">合併症を伴う糖尿病、膠原病（関節リウマチ、全身性エリテマトーデス（SLE）、強皮症、多発性筋炎、結節性多発動脈周囲炎）</div></div></div></div><div><p class="text-caption leading-relaxed text-neutral-700"><strong class="font-bold text-neutral-900 text-[14px]">過去5年以内に、病気で継続して7日以上の入院をしたことまたは手術を受けたことがありますか。（新型コロナウイルスによる入院は含みません。）</strong></p></div></div></div><p class="text-[11px] font-bold text-neutral-500 pt-1 pb-[2px] border-b border-warm-200">がんについて</p><div class="rounded-xl border border-warm-200 bg-white overflow-hidden"><div class="px-3 pt-3 pb-3 space-y-2"><div><p class="text-caption leading-relaxed text-neutral-700"><strong class="font-bold text-neutral-900 text-[14px]">今までに、がん（上皮内がんを含みます）・肉腫・悪性リンパ腫・白血病にかかったこと、または上皮内異形成になったことがありますか。</strong></p></div></div></div><p class="text-[11px] font-bold text-neutral-500 pt-1 pb-[2px] border-b border-warm-200">健康診断・人間ドックについて</p><div class="rounded-xl border border-warm-200 bg-white overflow-hidden"><div class="px-3 pt-3 pb-3 space-y-2"><div><p class="text-caption leading-relaxed text-neutral-700"><strong class="font-bold text-neutral-900 text-[14px]">過去2年以内に健康診断・人間ドックにおいて、以下の検査を受けて、異常の指摘を受けたことがありますか。</strong></p></div><div><p class="text-caption leading-relaxed text-neutral-700"><span>異常とは、要再検査・要精密検査・要治療をいいます。ただし、再検査・精密検査の結果、「異常なし」と診断された場合を除きます。</span></p></div><div class="space-y-1 pt-[2px]"><p class="text-caption font-bold text-neutral-800">『内視鏡検査・便潜血検査・マンモグラフィ検査』</p><p class="text-caption font-bold text-neutral-800">『しゅようマーカー（CEA、AFP、CA19-9、PSA）』</p></div></div></div><p class="text-[11px] font-bold text-neutral-500 pt-1 pb-[2px] border-b border-warm-200">身体の障がい・介護状態について</p><div class="rounded-xl border border-warm-200 bg-white overflow-hidden"><div class="px-3 pt-3 pb-3 space-y-2"><div><p class="text-caption leading-relaxed text-neutral-700"><strong class="font-bold text-neutral-900 text-[14px]">つぎのいずれか1つでも該当することはありますか。</strong></p></div><div><p class="text-caption leading-relaxed text-neutral-700"><span>●今までに、公的介護保険制度の要介護または要支援の認定を受けていたこと、もしくは、認定申請をしたことがある（40歳未満の方は該当しません）</span></p></div><div><p class="text-caption leading-relaxed text-neutral-700"><span>●現在、つぎの1〜5の日常生活のいずれかにおいて、他の方の介助またはご自身で補助具を必要とすることがある。＊骨折中などにより現在一時的に必要とする場合も含みます。＜1.歩行 2.衣服の着替え 3.入浴 4.食事 5.排泄＞</span></p></div></div></div></div></div><div class="px-6 py-3 border-t border-warm-200"><div class="space-y-2"><div class="grid grid-cols-2 gap-x-3 gap-y-6"><button class="flex flex-col items-center justify-center gap-[2px] rounded-xl py-3 font-bold border-2 transition-colors" style="border-color:var(--color-attention);color:var(--color-attention);background:#FFF5F5"><span class="flex items-center gap-2 text-h6 font-bold"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" class="w-4 h-4"><path d="M18 6L6 18M6 6l12 12"></path></svg>はい</span><span class="text-[10px] font-medium leading-tight" style="color:var(--color-attention)">１つでも存在する</span></button><button class="flex flex-col items-center justify-center gap-[2px] rounded-xl py-3 font-bold border-2 transition-colors" style="border-color:#16A34A;color:#16A34A;background:#F0FDF4"><span cla xt-[10px] tracking-[0.14em] uppercase text-neutral-400">保険内容</span><button class="flex items-center gap-1 text-caption font-medium" style="color:var(--color-link)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-4 h-4"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>修正</button></div><div class="mt-[2px] flex items-center flex-wrap gap-x-2 gap-y-[2px] text-caption"><span class="font-bold text-neutral-800">がん・障害介護保障型</span><span class="text-warm-300">|</span><span class="text-neutral-700 tabular-nums">10,000<!-- -->円/月</span><span class="text-warm-300">|</span><span class="text-neutral-700 tabular-nums">15<!-- -->年</span></div></div><div class="flex items-center justify-center gap-3"><button class="text-caption font-medium shrink-0 px-1" style="color:var(--color-link)">← 戻る</button><div style="width:100%;max-width:260px"><button data-slot="button" class="inline-flex items-center justify-center whitespace-nowrap text-sm transition-colors duration-200 ease-out disabled:pointer-events-none disabled:opacity-50 [&amp;_svg]:pointer-events-none [&amp;_svg:not([class*=&#x27;size-&#x27;])]:size-4 shrink-0 [&amp;_svg]:shrink-0 outline-none focus-visible:border-ring focus-visible:ring-ring/50 focus-visible:ring-[3px] aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 aria-invalid:border-destructive bg-primary shadow-xs hover:bg-button-primary-hover py-2 has-[&gt;svg]:px-3 h-16 md:h-16 rounded-xl gap-2 px-4 font-bold active:scale-[.99] text-white w-full" type="button" style="background-image:linear-gradient(135deg, #075FE3 0%, #64B0F7 100%)">入力内容を確認する<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><path d="M9 18l6-6-6-6"></path></svg></button></div></div></div><div class="absolute inset-0 z-50"><div class="absolute inset-0 bg-black/40 fade-in"></div><div class="sheet-up absolute left-0 right-0 bottom-0 bg-white rounded-t-2xl shadow-xl max-h-[88%] flex flex-col"><div class="flex items-center justify-between gap-2 px-6 pt-4 pb-3 border-b border-warm-200"><h3 class="flex items-center gap-2 text-h6 font-bold text-neutral-800 min-w-0"><span class="grid place-items-center w-6 h-6 rounded-full shrink-0 text-white" style="background:var(--color-attention)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" class="w-3 h-3"><path d="M12 6v8"></path><path d="M12 18v.01"></path></svg></span><span>がん・障害介護保障型<!-- -->　死亡保障<!-- -->なし<!-- -->の告知項目</span></h3><button class="grid place-items-center w-8 h-8 rounded-full bg-warm-100 text-neutral-500 shrink-0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="w-4 h-4"><path d="M18 6L6 18M6 6l12 12"></path></svg></button></div><div class="flex-1 overflow-y-auto no-sb px-4 py-4 space-y-3"><p class="text-h5 font-bold text-neutral-800 leading-snug pt-1">告知に関する重要事項</p><p class="text-caption text-neutral-600 leading-relaxed whitespace-pre-line">下記の内容をご確認のうえ、お申し込みください。</p><p class="text-caption font-bold text-neutral-800 leading-relaxed">保険商品お申し込みの方へ</p><p class="text-caption text-neutral-600 leading-relaxed whitespace-pre-line">募集用資料・告知書・告知説明資料等において、ご契約者や被保険者は健康状態等について告知をしていただく義務があります。</p><p class="text-caption text-neutral-600 leading-relaxed whitespace-pre-line">生命保険は、多数の人々が公平に保険料を出し合い、相互に保険し合う制度です。したがって、初めから健康状態の良くない方や危険な職業に従事されている方等が無条件に契約されますと、保険料負担の公平性が保てません。</p><p class="text-caption text-neutral-600 leading-relaxed whitespace-pre-line">ご契約にあたっては、過去の傷病歴（傷病名・治療期間等）、現在の健康状態、身体の障がい状態、職業歴とうについて「告知書」で当社がおたずねすることについて、事実をありのままに正確にもれなくお知らせ（告知）ください</p><p class="text-caption text-neutral-600 leading-relaxed whitespace-pre-line">ご契約（責任開始期）前に生じた病気やケガにより、支払事由が生じた場合には、保険金・給付金はお支払い出来ません。（事例）契約前より高血圧・脂質異常で定期的に服薬中の場合
以下告知項目に該当しませんが、契約3ヶ月後に直接的な原因により脳梗塞が発症した場合などはお支払い出来ないことがあります。</p><p class="text-caption text-neutral-600 leading-relaxed whitespace-pre-line">※ただし、以下のような場合には責任開始期以後発生した原因によるものとみなし、保険金・給付金をお支払いします。</p><ul class="space-y-2"><li class="flex gap-2 text-caption text-neutral-600 leading-relaxed"><span class="text-neutral-400 shrink-0">・</span><span class="whitespace-pre-line">責任開始期から2年を経過した後で支払事由が生じた場合</span></li><li class="flex gap-2 text-caption text-neutral-600 leading-relaxed"><span class="text-neutral-400 shrink-0">・</span><span class="whitespace-pre-line">責任開始期以降、その疾病やケガによって医師の診察を受けたことがなく、かつ診断等による異常な指摘も受けていない場合。ただし、その原因となった病気やケガによる症状について被保険者が認識または自覚していた場合を除きます。</span></li></ul><div class="rounded-xl px-4 py-3 flex items-start gap-2" style="background:#F0F7FF;border:1px solid #C8DCFA"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="w-4 h-4 shrink-0 mt-[2px]" style="color:var(--color-primary)"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5"></path><path d="M12 16v.01"></path></svg><p class="text-caption leading-relaxed" style="color:#054EBA">各質問に対して<strong>「はい」に当てはまる場合はお申し込みいただけません。</strong></p></div><div class="space-y-3"><div class="pt-8"><p class="text-h5 font-bold text-neutral-800 leading-snug">告知重要事項</p><p class="text-caption text-neutral-600 leading-relaxed mt-1">各項目をご確認のうえ、以下の内容にご回答ください。</p></div><p class="text-[11px] font-bold text-neutral-500 pt-1 pb-[2px] border-b border-warm-200">最近の健康状態</p><div class="rounded-xl border border-warm-200 bg-white overflow-hidden"><div class="px-3 pt-3 pb-3 space-y-2"><div><p class="text-caption leading-relaxed text-neutral-700"><strong class="font-bold text-neutral-900 text-[14px]">最近3ヶ月以内に、医師より検査・入院・手術を勧められたことがありますか。（検査には、健康診断、人間ドック、歯科検査、アレルギー検査を含みません）</strong></p></div></div></div><p class="text-[11px] font-bold text-neutral-500 pt-1 pb-[2px] border-b border-warm-200">病気・ケガについて</p><div class="rounded-xl border border-warm-200 bg-white overflow-hidden"><div class="px-3 pt-3 pb-3 space-y-2"><div><p class="text-caption leading-relaxed text-neutral-700"><strong class="font-bold text-neutral-900 text-[14px]">過去5年以内に別表の病気で、医師による診療・検査・治療・薬の処方を受けたことがありますか。</strong></p><div class="mt-2 rounded-lg border border-warm-200 overflow-hidden"><div class="grid grid-cols-[88px_1fr] "><div class="bg-warm-100 px-2 py-2 flex items-center border-r border-warm-200"><span class="text-[11px] font-bold text-neutral-600 leading-snug">心臓・血液</span></div><div class="px-2 py-2 text-[11px] text-neutral-700 leading-relaxed">狭心症、心筋梗塞、心臓弁膜症、不整脈、心筋症、心不全、大動脈瘤</div></div><div class="grid grid-cols-[88px_1fr] border-t border-warm-200"><div class="bg-warm-100 px-2 py-2 flex items-center border-r border-warm-200"><span class="text-[11px] font-bold text-neutral-600 leading-snug">脳</span></div><div class="px-2 py-2 text-[11px] text-neutral-700 leading-relaxed">脳卒中（脳出血、脳梗塞、くも膜下出血）、脳動脈瘤、脳しゅよう</div></div><div class="grid grid-cols-[88px_1fr] border-t border-warm-200"><div class="bg-warm-100 px-2 py-2 flex items-center border-r border-warm-200"><span class="text-[11px] font-bold text-neutral-600 leading-snug">精神・神経</span></div><div class="px-2 py-2 text-[11px] text-neutral-700 leading-relaxed">認知症、うつ病、統合失調症、アルコール依存症、てんかん、パーキンソン病、脊髄小脳変性症、多系統萎縮症、筋萎縮性側索硬化症、多発性硬化症</div></div><div class="grid grid-cols-[88px_1fr] border-t border-warm-200"><div class="bg-warm-100 px-2 py-2 flex items-center border-r border-warm-200"><span class="text-[11px] font-bold text-neutral-600 leading-snug">肝臓・腎臓・膵臓</span></div><div class="px-2 py-2 text-[11px] text-neutral-700 leading-relaxed">慢性肝炎、肝硬変、慢性腎炎、ネフローゼ、腎不全、すい炎</div></div><div class="grid grid-cols-[88px_1fr] border-t border-warm-200"><div class="bg-warm-100 px-2 py-2 flex items-center border-r border-warm-200"><span class="text-[11px] font-bold text-neutral-600 leading-snug">肺</span></div><div class="px-2 py-2 text-[11px] text-neutral-700 leading-relaxed">肺気腫、閉塞性肺疾患、間質性肺炎、誤嚥性肺炎</div></div><div class="grid grid-cols-[88px_1fr] border-t border-warm-200"><div class="bg-warm-100 px-2 py-2 flex items-center border-r border-warm-200"><span class="text-[11px] font-bold text-neutral-600 leading-snug">目</span></div><div class="px-2 py-2 text-[11px] text-neutral-700 leading-relaxed">緑内障、加齢黄斑変性症、網膜色素変性症</div></div><div class="grid grid-cols-[88px_1fr] border-t border-warm-200"><div class="bg-warm-100 px-2 py-2 flex items-center border-r border-warm-200"><span class="text-[11px] font-bold text-neutral-600 leading-snug">悪性新生物</span></div><div class="px-2 py-2 text-[11px] text-neutral-700 leading-relaxed">がん、肉腫、悪性の腫瘍、白血病、悪性リンパ腫、骨髄腫、骨髄異形成症候群</div></div><div class="grid grid-cols-[88px_1fr] border-t border-warm-200"><div class="bg-warm-100 px-2 py-2 flex items-center border-r border-warm-200"><span class="text-[11px] font-bold text-neutral-600 leading-snug">その他</span></div><div class="px-2 py-2 text-[11px] text-neutral-700 leading-relaxed">合併症を伴う糖尿病、膠原病（関節リウマチ、全身性エリテマトーデス（SLE）、強皮症、多発性筋炎、結節性多発動脈周囲炎）</div></div></div></div><div><p class="text-caption leading-relaxed text-neutral-700"><strong class="font-bold text-neutral-900 text-[14px]">過去5年以内に、病気で継続して7日以上の入院をしたことまたは手術を受けたことがありますか。（新型コロナウイルスによる入院は含みません。）</strong></p></div></div></div><p class="text-[11px] font-bold text-neutral-500 pt-1 pb-[2px] border-b border-warm-200">がんについて</p><div class="rounded-xl border border-warm-200 bg-white overflow-hidden"><div class="px-3 pt-3 pb-3 space-y-2"><div><p class="text-caption leading-relaxed text-neutral-700"><strong class="font-bold text-neutral-900 text-[14px]">今までに、がん（上皮内がんを含みます）・肉腫・悪性リンパ腫・白血病にかかったこと、または上皮内異形成になったことがありますか。</strong></p></div></div></div><p class="text-[11px] font-bold text-neutral-500 pt-1 pb-[2px] border-b border-warm-200">健康診断・人間ドックについて</p><div class="rounded-xl border border-warm-200 bg-white overflow-hidden"><div class="px-3 pt-3 pb-3 space-y-2"><div><p class="text-caption leading-relaxed text-neutral-700"><strong class="font-bold text-neutral-900 text-[14px]">過去2年以内に健康診断・人間ドックにおいて、以下の検査を受けて、異常の指摘を受けたことがありますか。</strong></p></div><div><p class="text-caption leading-relaxed text-neutral-700"><span>異常とは、要再検査・要精密検査・要治療をいいます。ただし、再検査・精密検査の結果、「異常なし」と診断された場合を除きます。</span></p></div><div class="space-y-1 pt-[2px]"><p class="text-caption font-bold text-neutral-800">『内視鏡検査・便潜血検査・マンモグラフィ検査』</p><p class="text-caption font-bold text-neutral-800">『しゅようマーカー（CEA、AFP、CA19-9、PSA）』</p></div></div></div><p class="text-[11px] font-bold text-neutral-500 pt-1 pb-[2px] border-b border-warm-200">身体の障がい・介護状態について</p><div class="rounded-xl border border-warm-200 bg-white overflow-hidden"><div class="px-3 pt-3 pb-3 space-y-2"><div><p class="text-caption leading-relaxed text-neutral-700"><strong class="font-bold text-neutral-900 text-[14px]">つぎのいずれか1つでも該当することはありますか。</strong></p></div><div><p class="text-caption leading-relaxed text-neutral-700"><span>●今までに、公的介護保険制度の要介護または要支援の認定を受けていたこと、もしくは、認定申請をしたことがある（40歳未満の方は該当しません）</span></p></div><div><p class="text-caption leading-relaxed text-neutral-700"><span>●現在、つぎの1〜5の日常生活のいずれかにおいて、他の方の介助またはご自身で補助具を必要とすることがある。＊骨折中などにより現在一時的に必要とする場合も含みます。＜1.歩行 2.衣服の着替え 3.入浴 4.食事 5.排泄＞</span></p></div></div></div></div></div><div class="px-6 py-3 border-t border-warm-200"><div class="space-y-2"><div class="grid grid-cols-2 gap-x-3 gap-y-6"><button class="flex flex-col items-center justify-center gap-[2px] rounded-xl py-3 font-bold border-2 transition-colors" style="border-color:var(--color-attention);color:var(--color-attention);background:#FFF5F5"><span class="flex items-center gap-2 text-h6 font-bold"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" class="w-4 h-4"><path d="M18 6L6 18M6 6l12 12"></path></svg>はい</span><span class="text-[10px] font-medium leading-tight" style="color:var(--color-attention)">１つでも存在する</span></button><button class="flex flex-col items-center justify-center gap-[2px] rounded-xl py-3 font-bold border-2 transition-colors" style="border-color:#16A34A;color:#16A34A;background:#F0FDF4"><span cla bottom-0 bg-white rounded-t-2xl shadow-xl max-h-[88%] flex flex-col"><div class="flex items-center justify-between gap-2 px-6 pt-4 pb-3 border-b border-warm-200"><h3 class="flex items-center gap-2 text-h6 font-bold text-neutral-800 min-w-0"><span class="grid place-items-center w-6 h-6 rounded-full shrink-0 text-white" style="background:var(--color-attention)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" class="w-3 h-3"><path d="M12 6v8"></path><path d="M12 18v.01"></path></svg></span><span>三大疾病保障型<!-- -->　死亡保障<!-- -->あり<!-- -->の告知項目</span></h3><button class="grid place-items-center w-8 h-8 rounded-full bg-warm-100 text-neutral-500 shrink-0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="w-4 h-4"><path d="M18 6L6 18M6 6l12 12"></path></svg></button></div><div class="flex-1 overflow-y-auto no-sb px-4 py-4 space-y-3"><p class="text-h5 font-bold text-neutral-800 leading-snug pt-1">告知に関する重要事項</p><p class="text-caption text-neutral-600 leading-relaxed whitespace-pre-line">下記の内容をご確認のうえ、お申し込みください。</p><p class="text-caption font-bold text-neutral-800 leading-relaxed">保険商品お申し込みの方へ</p><p class="text-caption text-neutral-600 leading-relaxed whitespace-pre-line">募集用資料・告知書・告知説明資料等において、ご契約者や被保険者は健康状態等について告知をしていただく義務があります。</p><p class="text-caption text-neutral-600 leading-relaxed whitespace-pre-line">生命保険は、多数の人々が公平に保険料を出し合い、相互に保険し合う制度です。したがって、初めから健康状態の良くない方や危険な職業に従事されている方等が無条件に契約されますと、保険料負担の公平性が保てません。</p><p class="text-caption text-neutral-600 leading-relaxed whitespace-pre-line">ご契約にあたっては、過去の傷病歴（傷病名・治療期間等）、現在の健康状態、身体の障がい状態、職業歴とうについて「告知書」で当社がおたずねすることについて、事実をありのままに正確にもれなくお知らせ（告知）ください</p><p class="text-caption text-neutral-600 leading-relaxed whitespace-pre-line">ご契約（責任開始期）前に生じた病気やケガにより、支払事由が生じた場合には、保険金・給付金はお支払い出来ません。（事例）契約前より高血圧・脂質異常で定期的に服薬中の場合
以下告知項目に該当しませんが、契約3ヶ月後に直接的な原因により脳梗塞が発症した場合などはお支払い出来ないことがあります。</p><p class="text-caption text-neutral-600 leading-relaxed whitespace-pre-line">※ただし、以下のような場合には責任開始期以後発生した原因によるものとみなし、保険金・給付金をお支払いします。</p><ul class="space-y-2"><li class="flex gap-2 text-caption text-neutral-600 leading-relaxed"><span class="text-neutral-400 shrink-0">・</span><span class="whitespace-pre-line">責任開始期から2年を経過した後で支払事由が生じた場合</span></li><li class="flex gap-2 text-caption text-neutral-600 leading-relaxed"><span class="text-neutral-400 shrink-0">・</span><span class="whitespace-pre-line">責任開始期以降、その疾病やケガによって医師の診察を受けたことがなく、かつ診断等による異常な指摘も受けていない場合。ただし、その原因となった病気やケガによる症状について被保険者が認識または自覚していた場合を除きます。</span></li></ul><div class="rounded-xl px-4 py-3 flex items-start gap-2" style="background:#F0F7FF;border:1px solid #C8DCFA"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="w-4 h-4 shrink-0 mt-[2px]" style="color:var(--color-primary)"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5"></path><path d="M12 16v.01"></path></svg><p class="text-caption leading-relaxed" style="color:#054EBA">各質問に対して<strong>「はい」に当てはまる場合はお申し込みいただけません。</strong></p></div><div class="space-y-3"><div class="pt-8"><p class="text-h5 font-bold text-neutral-800 leading-snug">告知重要事項</p><p class="text-caption text-neutral-600 leading-relaxed mt-1">各項目をご確認のうえ、以下の内容にご回答ください。</p></div><p class="text-[11px] font-bold text-neutral-500 pt-1 pb-[2px] border-b border-warm-200">最近の健康状態</p><div class="rounded-xl border border-warm-200 bg-white overflow-hidden"><div class="px-3 pt-3 pb-3 space-y-2"><div><p class="text-caption leading-relaxed text-neutral-700"><strong class="font-bold text-neutral-900 text-[14px]">最近3ヶ月以内に、医師より検査・入院・手術を勧められたことがありますか。（検査には、健康診断、人間ドック、歯科検査、アレルギー検査を含みません）</strong></p></div></div></div><p class="text-[11px] font-bold text-neutral-500 pt-1 pb-[2px] border-b border-warm-200">病気・ケガについて</p><div class="rounded-xl border border-warm-200 bg-white overflow-hidden"><div class="px-3 pt-3 pb-3 space-y-2"><div><p class="text-caption leading-relaxed text-neutral-700"><strong class="font-bold text-neutral-900 text-[14px]">過去5年以内に別表の病気で、医師による診療・検査・治療・薬の処方を受けたことがありますか。</strong></p><div class="mt-2 rounded-lg border border-warm-200 overflow-hidden"><div class="grid grid-cols-[88px_1fr] "><div class="bg-warm-100 px-2 py-2 flex items-center border-r border-warm-200"><span class="text-[11px] font-bold text-neutral-600 leading-snug">心臓・血液</span></div><div class="px-2 py-2 text-[11px] text-neutral-700 leading-relaxed">狭心症、心筋梗塞、心臓弁膜症、不整脈、心筋症、心不全、大動脈瘤</div></div><div class="grid grid-cols-[88px_1fr] border-t border-warm-200"><div class="bg-warm-100 px-2 py-2 flex items-center border-r border-warm-200"><span class="text-[11px] font-bold text-neutral-600 leading-snug">脳</span></div><div class="px-2 py-2 text-[11px] text-neutral-700 leading-relaxed">脳卒中（脳出血、脳梗塞、くも膜下出血）、脳動脈瘤、脳しゅよう</div></div><div class="grid grid-cols-[88px_1fr] border-t border-warm-200"><div class="bg-warm-100 px-2 py-2 flex items-center border-r border-warm-200"><span class="text-[11px] font-bold text-neutral-600 leading-snug">精神・神経</span></div><div class="px-2 py-2 text-[11px] text-neutral-700 leading-relaxed">認知症、うつ病、統合失調症、アルコール依存症、てんかん、パーキンソン病、脊髄小脳変性症、多系統萎縮症、筋萎縮性側索硬化症、多発性硬化症</div></div><div class="grid grid-cols-[88px_1fr] border-t border-warm-200"><div class="bg-warm-100 px-2 py-2 flex items-center border-r border-warm-200"><span class="text-[11px] font-bold text-neutral-600 leading-snug">肝臓・腎臓・膵臓</span></div><div class="px-2 py-2 text-[11px] text-neutral-700 leading-relaxed">慢性肝炎、肝硬変、慢性腎炎、ネフローゼ、腎不全、すい炎</div></div><div class="grid grid-cols-[88px_1fr] border-t border-warm-200"><div class="bg-warm-100 px-2 py-2 flex items-center border-r border-warm-200"><span class="text-[11px] font-bold text-neutral-600 leading-snug">肺</span></div><div class="px-2 py-2 text-[11px] text-neutral-700 leading-relaxed">肺気腫、閉塞性肺疾患、間質性肺炎、誤嚥性肺炎</div></div><div class="grid grid-cols-[88px_1fr] border-t border-warm-200"><div class="bg-warm-100 px-2 py-2 flex items-center border-r border-warm-200"><span class="text-[11px] font-bold text-neutral-600 leading-snug">目</span></div><div class="px-2 py-2 text-[11px] text-neutral-700 leading-relaxed">—</div></div><div class="grid grid-cols-[88px_1fr] border-t border-warm-200"><div class="bg-warm-100 px-2 py-2 flex items-center border-r border-warm-200"><span class="text-[11px] font-bold text-neutral-600 leading-snug">悪性新生物</span></div><div class="px-2 py-2 text-[11px] text-neutral-700 leading-relaxed">がん、肉腫、悪性の腫瘍、白血病、悪性リンパ腫、骨髄腫、骨髄異形成症候群</div></div><div class="grid grid-cols-[88px_1fr] border-t border-warm-200"><div class="bg-warm-100 px-2 py-2 flex items-center border-r border-warm-200"><span class="text-[11px] font-bold text-neutral-600 leading-snug">その他</span></div><div class="px-2 py-2 text-[11px] text-neutral-700 leading-relaxed">合併症を伴う糖尿病、膠原病（関節リウマチ、全身性エリテマトーデス（SLE）、強皮症、多発性筋炎、結節性多発動脈周囲炎）</div></div></div></div><div><p class="text-caption leading-relaxed text-neutral-700"><strong class="font-bold text-neutral-900 text-[14px]">過去5年以内に、病気で継続して7日以上の入院をしたことまたは手術を受けたことがありますか。（新型コロナウイルスによる入院は含みません。）</strong></p></div></div></div><p class="text-[11px] font-bold text-neutral-500 pt-1 pb-[2px] border-b border-warm-200">がんについて</p><div class="rounded-xl border border-warm-200 bg-white overflow-hidden"><div class="px-3 pt-3 pb-3 space-y-2"><div><p class="text-caption leading-relaxed text-neutral-700"><strong class="font-bold text-neutral-900 text-[14px]">今までに、がん（上皮内がんを含みます）・肉腫・悪性リンパ腫・白血病にかかったこと、または上皮内異形成になったことがありますか。</strong></p></div></div></div><p class="text-[11px] font-bold text-neutral-500 pt-1 pb-[2px] border-b border-warm-200">健康診断・人間ドックについて</p><div class="rounded-xl border border-warm-200 bg-white overflow-hidden"><div class="px-3 pt-3 pb-3 space-y-2"><div><p class="text-caption leading-relaxed text-neutral-700"><strong class="font-bold text-neutral-900 text-[14px]">過去2年以内に健康診断・人間ドックにおいて、以下の検査を受けて、異常の指摘を受けたことがありますか。</strong></p></div><div><p class="text-caption leading-relaxed text-neutral-700"><span>異常とは、要再検査・要精密検査・要治療をいいます。ただし、再検査・精密検査の結果、「異常なし」と診断された場合を除きます。</span></p></div><div class="space-y-1 pt-[2px]"><p class="text-caption font-bold text-neutral-800">『心電図検査・内視鏡検査・便潜血検査・マンモグラフィ検査』</p><p class="text-caption font-bold text-neutral-800">『しゅようマーカー（CEA、AFP、CA19-9、PSA）』</p></div></div></div><p class="text-[11px] font-bold text-neutral-500 pt-1 pb-[2px] border-b border-warm-200">女性の方</p><div class="rounded-xl border border-warm-200 bg-white overflow-hidden"><div class="px-3 pt-3 pb-3 space-y-2"><div><p class="text-caption leading-relaxed text-neutral-700"><strong class="font-bold text-neutral-900 text-[14px]">現在妊娠していますか。</strong></p></div></div></div></div></div><div class="px-6 py-3 border-t border-warm-200"><div class="space-y-2"><div class="grid grid-cols-2 gap-x-3 gap-y-6"><button class="flex flex-col items-center justify-center gap-[2px] rounded-xl py-3 font-bold border-2 transition-colors" style="border-color:var(--color-attention);color:var(--color-attention);background:#FFF5F5"><span class="flex items-center gap-2 text-h6 font-bold"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" class="w-4 h-4"><path d="M18 6L6 18M6 6l12 12"></path></svg>はい</span><span class="text-[10px] font-medium leading-tight" style="color:var(--color-attention)">１つでも存在する</span></button><button class="flex flex-col items-center justify-center gap-[2px] rounded-xl py-3 font-bold border-2 transition-colors" style="border-color:#16A34A;color:#16A34A;background:#F0FDF4"><span class="flex items-center gap-2 text-h6 font-bold"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" class="w-4 h-4"><path d="M5 12l5 5L19 7"></path></svg>いいえ</span><span class="text-[10px] font-medium leading-tight" style="color:#16A34A">すべていいえ</span></button></div><p class="text-center text-[11px] text-neutral-400">すべての項目が「いいえ」の場合に進めます  fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" class="w-3 h-3"><path d="M12 6v8"></path><path d="M12 18v.01"></path></svg></span><span>三大疾病保障型<!-- -->　死亡保障<!-- -->なし<!-- -->の告知項目</span></h3><button class="grid place-items-center w-8 h-8 rounded-full bg-warm-100 text-neutral-500 shrink-0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="w-4 h-4"><path d="M18 6L6 18M6 6l12 12"></path></svg></button></div><div class="flex-1 overflow-y-auto no-sb px-4 py-4 space-y-3"><p class="text-h5 font-bold text-neutral-800 leading-snug pt-1">告知に関する重要事項</p><p class="text-caption text-neutral-600 leading-relaxed whitespace-pre-line">下記の内容をご確認のうえ、お申し込みください。</p><p class="text-caption font-bold text-neutral-800 leading-relaxed">保険商品お申し込みの方へ</p><p class="text-caption text-neutral-600 leading-relaxed whitespace-pre-line">募集用資料・告知書・告知説明資料等において、ご契約者や被保険者は健康状態等について告知をしていただく義務があります。</p><p class="text-caption text-neutral-600 leading-relaxed whitespace-pre-line">生命保険は、多数の人々が公平に保険料を出し合い、相互に保険し合う制度です。したがって、初めから健康状態の良くない方や危険な職業に従事されている方等が無条件に契約されますと、保険料負担の公平性が保てません。</p><p class="text-caption text-neutral-600 leading-relaxed whitespace-pre-line">ご契約にあたっては、過去の傷病歴（傷病名・治療期間等）、現在の健康状態、身体の障がい状態、職業歴とうについて「告知書」で当社がおたずねすることについて、事実をありのままに正確にもれなくお知らせ（告知）ください</p><p class="text-caption text-neutral-600 leading-relaxed whitespace-pre-line">ご契約（責任開始期）前に生じた病気やケガにより、支払事由が生じた場合には、保険金・給付金はお支払い出来ません。（事例）契約前より高血圧・脂質異常で定期的に服薬中の場合
以下告知項目に該当しませんが、契約3ヶ月後に直接的な原因により脳梗塞が発症した場合などはお支払い出来ないことがあります。</p><p class="text-caption text-neutral-600 leading-relaxed whitespace-pre-line">※ただし、以下のような場合には責任開始期以後発生した原因によるものとみなし、保険金・給付金をお支払いします。</p><ul class="space-y-2"><li class="flex gap-2 text-caption text-neutral-600 leading-relaxed"><span class="text-neutral-400 shrink-0">・</span><span class="whitespace-pre-line">責任開始期から2年を経過した後で支払事由が生じた場合</span></li><li class="flex gap-2 text-caption text-neutral-600 leading-relaxed"><span class="text-neutral-400 shrink-0">・</span><span class="whitespace-pre-line">責任開始期以降、その疾病やケガによって医師の診察を受けたことがなく、かつ診断等による異常な指摘も受けていない場合。ただし、その原因となった病気やケガによる症状について被保険者が認識または自覚していた場合を除きます。</span></li></ul><div class="rounded-xl px-4 py-3 flex items-start gap-2" style="background:#F0F7FF;border:1px solid #C8DCFA"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="w-4 h-4 shrink-0 mt-[2px]" style="color:var(--color-primary)"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5"></path><path d="M12 16v.01"></path></svg><p class="text-caption leading-relaxed" style="color:#054EBA">各質問に対して<strong>「はい」に当てはまる場合はお申し込みいただけません。</strong></p></div><div class="space-y-3"><div class="pt-8"><p class="text-h5 font-bold text-neutral-800 leading-snug">告知重要事項</p><p class="text-caption text-neutral-600 leading-relaxed mt-1">各項目をご確認のうえ、以下の内容にご回答ください。</p></div><p class="text-[11px] font-bold text-neutral-500 pt-1 pb-[2px] border-b border-warm-200">最近の健康状態</p><div class="rounded-xl border border-warm-200 bg-white overflow-hidden"><div class="px-3 pt-3 pb-3 space-y-2"><div><p class="text-caption leading-relaxed text-neutral-700"><strong class="font-bold text-neutral-900 text-[14px]">最近3ヶ月以内に、医師より検査・入院・手術を勧められたことがありますか。（検査には、健康診断、人間ドック、歯科検査、アレルギー検査を含みません）</strong></p></div></div></div><p class="text-[11px] font-bold text-neutral-500 pt-1 pb-[2px] border-b border-warm-200">病気・ケガについて</p><div class="rounded-xl border border-warm-200 bg-white overflow-hidden"><div class="px-3 pt-3 pb-3 space-y-2"><div><p class="text-caption leading-relaxed text-neutral-700"><strong class="font-bold text-neutral-900 text-[14px]">過去5年以内に、病気で継続して7日以上の入院をしたことまたは手術を受けたことがありますか。（新型コロナウイルスによる入院は含みません。）</strong></p></div></div></div><p class="text-[11px] font-bold text-neutral-500 pt-1 pb-[2px] border-b border-warm-200">がんについて</p><div class="rounded-xl border border-warm-200 bg-white overflow-hidden"><div class="px-3 pt-3 pb-3 space-y-2"><div><p class="text-caption leading-relaxed text-neutral-700"><strong class="font-bold text-neutral-900 text-[14px]">今までに、がん（上皮内がんを含みます）・肉腫・悪性リンパ腫・白血病にかかったこと、または上皮内異形成になったことがありますか。</strong></p></div></div></div><p class="text-[11px] font-bold text-neutral-500 pt-1 pb-[2px] border-b border-warm-200">健康診断・人間ドックについて</p><div class="rounded-xl border border-warm-200 bg-white overflow-hidden"><div class="px-3 pt-3 pb-3 space-y-2"><div><p class="text-caption leading-relaxed text-neutral-700"><strong class="font-bold text-neutral-900 text-[14px]">過去2年以内に健康診断・人間ドックにおいて、以下の検査を受けて、異常の指摘を受けたことがありますか。</strong></p></div><div><p class="text-caption leading-relaxed text-neutral-700"><span>異常とは、要再検査・要精密検査・要治療をいいます。ただし、再検査・精密検査の結果、「異常なし」と診断された場合を除きます。</span></p></div><div class="space-y-1 pt-[2px]"><p class="text-caption font-bold text-neutral-800">『心電図検査・内視鏡検査・便潜血検査・マンモグラフィ検査』</p><p class="text-caption font-bold text-neutral-800">『しゅようマーカー（CEA、AFP、CA19-9、PSA）』</p></div></div></div><p class="text-[11px] font-bold text-neutral-500 pt-1 pb-[2px] border-b border-warm-200">女性の方</p><div class="rounded-xl border border-warm-200 bg-white overflow-hidden"><div class="px-3 pt-3 pb-3 space-y-2"><div><p class="text-caption leading-relaxed text-neutral-700"><strong class="font-bold text-neutral-900 text-[14px]">現在妊娠していますか。</strong></p></div></div></div></div></div><div class="px-6 py-3 border-t border-warm-200"><div class="space-y-2"><div class="grid grid-cols-2 gap-x-3 gap-y-6"><button class="flex flex-col items-center justify-center gap-[2px] rou
