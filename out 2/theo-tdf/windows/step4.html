ding-relaxed">「クレジットカードのお支払いについて」を確認いただいたうえで、カード番号や有効期限などを入力いただきます。</p></div><div class="rounded-2xl border border-warm-200 bg-white overflow-hidden"><button class="flex items-center justify-between w-full px-4 py-4 text-left"><h4 class="text-h6 font-bold text-neutral-800">クレジットカードのお支払いについて</h4><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 text-primary shrink-0 transition-transform duration-300 rotate-180"><path d="M6 9l6 6 6-6"></path></svg></button><div style="max-height:2000px;opacity:1" class="overflow-hidden transition-all duration-300 ease-out"><div class="px-4 pb-4 border-t border-warm-200 pt-3 space-y-3"><ul class="space-y-3"><li class="flex gap-2 text-caption text-neutral-600 leading-relaxed"><span class="text-neutral-400 shrink-0">・</span><span>カード名義人は被保険者さま本人名義に限ります。</span></li><li class="text-caption text-neutral-600 leading-relaxed"><span class="flex gap-2"><span class="text-neutral-400 shrink-0">・</span><span>以下のマークのあるクレジットカードをご指定いただけます。</span></span><div class="flex flex-wrap gap-2 mt-2 ml-4"><span class="rounded border border-warm-300 bg-white px-2 py-1 text-[10px] font-en font-semibold tracking-wide text-neutral-600">VISA</span><span class="rounded border border-warm-300 bg-white px-2 py-1 text-[10px] font-en font-semibold tracking-wide text-neutral-600">Mastercard</span><span class="rounded border border-warm-300 bg-white px-2 py-1 text-[10px] font-en font-semibold tracking-wide text-neutral-600">JCB</span><span class="rounded border border-warm-300 bg-white px-2 py-1 text-[10px] font-en font-semibold tracking-wide text-neutral-600">AMEX</span><span class="rounded border border-warm-300 bg-white px-2 py-1 text-[10px] font-en font-semibold tracking-wide text-neutral-600">Diners</span></div></li><li class="flex gap-2 text-caption text-neutral-600 leading-relaxed"><span class="text-neutral-400 shrink-0">・</span><span>今後の保険料のお支払は、ご指定いただきましたクレジットカードの発行会社が定める会員規約に基づいて行われます。</span></li><li class="flex gap-2 text-caption text-neutral-600 leading-relaxed"><span class="text-neutral-400 shrink-0">・</span><span>クレジットカード支払につきましては、クレジットカード支払規定に基づいて行いますので、お申し込みの前に必ずご一読ください。</span></li><li class="flex gap-2 text-caption text-neutral-600 leading-relaxed"><span class="text-neutral-400 shrink-0">・</span><span>クレジットカード支払のお取扱い金額は、1契約1回あたり、10万円以下となっております。</span></li><li class="flex gap-2 text-caption text-neutral-600 leading-relaxed"><span class="text-neutral-400 shrink-0">・</span><span>クレジットカードの発行会社が保険料相当額をT&amp;Dフィナンシャル生命に入金させ、ご加入者さまの利用口座から保険料相当額のお振り替えをおこなう仕組みになっております。したがって、ご契約の消滅（解約・死亡等）または、T&amp;Dフィナンシャル生命にお払込みが完了された場合でも、翌月以降に保険料相当額の決済（クレジットカードの発行会社によるお振り替え）が発生することがあります。</span></li><li class="flex gap-2 text-caption text-neutral-600 leading-relaxed"><span class="text-neutral-400 shrink-0">・</span><span>保険料相当額の決済日はクレジットカードの発行会社によって異なります。決済日は、直接クレジットカードの発行会社にお問い合わせください。</span></li><li class="flex gap-2 text-caption text-neutral-600 leading-relaxed"><span class="text-neutral-400 shrink-0">・</span><span>ご利用のクレジットカード番号・カード有効期限等が変更された場合、すみやかに保険のマイページより変更ください。（ご指定いただきましたクレジットカードの発行会社によっては、クレジットカードによる保険料のお支払いができなくなる場合があります。）</span></li></ul></div></div></div><div class="rounded-2xl border border-warm-200 bg-white overflow-hidden"><button class="flex items-center justify-between w-full px-4 py-4 text-left"><h4 class="text-h6 font-bold text-neutral-800">クレジットカード支払規定</h4><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 text-primary shrink-0 transition-transform duration-300 "><path d="M6 9l6 6 6-6"></path></svg></button><div style="max-height:0px;opacity:0" class="overflow-hidden transition-all duration-300 ease-out"><div class="px-4 pb-4 border-t border-warm-200 pt-3"><ul class="space-y-3"><li class="flex gap-2 text-caption text-neutral-600 leading-relaxed"><span class="text-neutral-400 shrink-0">・</span><span>私がT&amp;Dフィナンシャル生命保険株式会社（以下「T&amp;Dフィナンシャル生命」 -600">Diners</span></div></li><li class="flex gap-2 text-caption text-neutral-600 leading-relaxed"><span class="text-neutral-400 shrink-0">・</span><span>今後の保険料のお支払は、ご指定いただきましたクレジットカードの発行会社が定める会員規約に基づいて行われます。</span></li><li class="flex gap-2 text-caption text-neutral-600 leading-relaxed"><span class="text-neutral-400 shrink-0">・</span><span>クレジットカード支払につきましては、クレジットカード支払規定に基づいて行いますので、お申し込みの前に必ずご一読ください。</span></li><li class="flex gap-2 text-caption text-neutral-600 leading-relaxed"><span class="text-neutral-400 shrink-0">・</span><span>クレジットカード支払のお取扱い金額は、1契約1回あたり、10万円以下となっております。</span></li><li class="flex gap-2 text-caption text-neutral-600 leading-relaxed"><span class="text-neutral-400 shrink-0">・</span><span>クレジットカードの発行会社が保険料相当額をT&amp;Dフィナンシャル生命に入金させ、ご加入者さまの利用口座から保険料相当額のお振り替えをおこなう仕組みになっております。したがって、ご契約の消滅（解約・死亡等）または、T&amp;Dフィナンシャル生命にお払込みが完了された場合でも、翌月以降に保険料相当額の決済（クレジットカードの発行会社によるお振り替え）が発生することがあります。</span></li><li class="flex gap-2 text-caption text-neutral-600 leading-relaxed"><span class="text-neutral-400 shrink-0">・</span><span>保険料相当額の決済日はクレジットカードの発行会社によって異なります。決済日は、直接クレジットカードの発行会社にお問い合わせください。</span></li><li class="flex gap-2 text-caption text-neutral-600 leading-relaxed"><span class="text-neutral-400 shrink-0">・</span><span>ご利用のクレジットカード番号・カード有効期限等が変更された場合、すみやかに保険のマイページより変更ください。（ご指定いただきましたクレジットカードの発行会社によっては、クレジットカードによる保険料のお支払いができなくなる場合があります。）</span></li></ul></div></div></div><div class="rounded-2xl border border-warm-200 bg-white overflow-hidden"><button class="flex items-center justify-between w-full px-4 py-4 text-left"><h4 class="text-h6 font-bold text-neutral-800">クレジットカード支払規定</h4><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 text-primary shrink-0 transition-transform duration-300 "><path d="M6 9l6 6 6-6"></path></svg></button><div style="max-height:0px;opacity:0" class="overflow-hidden transition-all duration-300 ease-out"><div class="px-4 pb-4 border-t border-warm-200 pt-3"><ul class="space-y-3"><li class="flex gap-2 text-caption text-neutral-600 leading-relaxed"><span class="text-neutral-400 shrink-0">・</span><span>私がT&amp;Dフィナンシャル生命保険株式会社（以下「T&amp;Dフィナンシャル生命」といいます。）と締結した生命保険契約の保険料は、私が指定する私名義のクレジットカード（以下「指定カード」といいます。）で指定カード発行会社の会員規約に基づいて支払います。</span></li><li class="flex gap-2 text-caption text-neutral-600 leading-relaxed"><span class="text-neutral-400 shrink-0">・</span><span>私がT&amp;Dフィナンシャル生命に対し申し出をしない限り、保険料を前項と同様に指定カード発行会社の会員規約に基づいて、継続して支払います。</span></li><li class="flex gap-2 text-caption text-neutral-600 leading-relaxed"><span class="text-neutral-400 shrink-0">・</span><span>私は指定カード発行会社により、私が届け出た会員番号・有効期限が更新された場合であっても、保険料を異議なく支払います。</span></li><li class="flex gap-2 text-caption text-neutral-600 leading-relaxed"><span class="text-neutral-400 shrink-0">・</span><span>会員資格喪失等により、指定カード発行会社から指定カードによる保険料の支払いを停止されても異議はありません。</span></li><li class="flex gap-2 text-caption text-neutral-600 leading-relaxed"><span class="text-neutral-400 shrink-0">・</span><span>指定カードの会員番号や有効期限が変更となった場合、私に事前に通知することなく、新しい会員番号や有効期限が指定カード発行会社よりT&amp;Dフィナンシャル生命に通知されても、異議はありません。</span></li><li class="flex gap-2 text-caption text-neutral-600 leading-relaxed"><span class="text-neutral-400 shrink-0">・</span><span>私は指定カードの会員番号や有効期限が変更となった場合、すみやかにT&amp;Dフィナンシャル生命に通知します。</span></li><li class="flex gap-2 text-caption text-neutral-600 leading-relaxed"><span class="text-neutral-400 shrink-0">・</span><span>指定カードで支払った保険料については領収証は請求いたしません。</span></li></ul></div></div></div></section><div class="rounded-2xl border border-[color:var(--secondary-color-100)] bg-[color:var(--secondary-color-10)] p-4"><div class="flex items-center gap-2 mb-3"><span data-slot="badge" class="inline-flex items-center justify-center border text-xs w-fit whitespace-nowrap shrink-0 [&amp;&gt;svg]:size-3 gap-1 [&amp;&gt;svg]:pointer-events-none focus-visible:border-ring focus-visible:ring-ring/50 focus-visible:ring-[3px] aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 aria-invalid: ite text-neutral-800" id="_R_uiekmlubsnubrb_" value="090-0000-0000"/></div></div></div><div class="rounded-2xl border border-warm-200 bg-white p-6"><p class="font-mono text-caption tracking-[0.14em] uppercase text-neutral-900 mb-2">団体特定コード</p><div class="flex items-center justify-between py-3 border-b border-warm-200 last:border-0"><span class="text-caption text-neutral-500">コード</span><span class="text-h6 text-neutral-700">1234567891234567</span></div></div></section><section class="space-y-6"><h2 class="text-h4 font-bold text-neutral-800">保険料のお支払いについて</h2><p class="text-caption text-neutral-600 leading-relaxed">クレジットカードによる保険料払込における各種注意点を確認のうえ、お手続きください。</p><div><h3 class="text-h6 font-bold text-neutral-800">クレジットカード払の重要事項の確認</h3><p class="mt-2 text-caption text-neutral-600 leading-relaxed">「クレジットカードのお支払いについて」を確認いただいたうえで、カード番号や有効期限などを入力いただきます。</p></div><div class="rounded-2xl border border-warm-200 bg-white overflow-hidden"><button class="flex items-center justify-between w-full px-4 py-4 text-left"><h4 class="text-h6 font-bold text-neutral-800">クレジットカードのお支払いについて</h4><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 text-primary shrink-0 transition-transform duration-300 "><path d="M6 9l6 6 6-6"></path></svg></button><div style="max-height:0px;opacity:0" class="overflow-hidden transition-all duration-300 ease-out"><div class="px-4 pb-4 border-t border-warm-200 pt-3 space-y-3"><ul class="space-y-3"><li class="flex gap-2 text-caption text-neutral-600 leading-relaxed"><span class="text-neutral-400 shrink-0">・</span><span>カード名義人は被保険者さま本人名義に限ります。</span></li><li class="text-caption text-neutral-600 leading-relaxed"><span class="flex gap-2"><span class="text-neutral-400 shrink-0">・</span><span>以下のマークのあるクレジットカードをご指定いただけます。</span></span><div class="flex flex-wrap gap-2 mt-2 ml-4"><span class="rounded border border-warm-300 bg-white px-2 py-1 text-[10px] font-en font-semibold tracking-wide text-neutral-600">VISA</span><span class="rounded border border-warm-300 bg-white px-2 py-1 text-[10px] font-en font-semibold tracking-wide text-neutral-600">Mastercard</span><span class="rounded border border-warm-300 bg-white px-2 py-1 text-[10px] font-en font-semibold tracking-wide text-neutral-600">JCB</span><span class="rounded border border-warm-300 bg-white px-2 py-1 text-[10px] font-en font-semibold tracking-wide text-neutral-600">AMEX</span><span class="rounded border border-warm-300 bg-white px-2 py-1 text-[10px] font-en font-semibold tracking-wide text-neutral-600">Diners</span></div></li><li class="flex gap-2 text-caption text-neutral-600 leading-relaxed"><span class="text-neutral-400 shrink-0">・</span><span>今後の保険料のお支払は、ご指定いただきましたクレジットカードの発行会社が定める会員規約に基づいて行われます。</span></li><li class="flex gap-2 text-caption text-neutral-600 leading-relaxed"><span class="text-neutral-400 shrink-0">・</span><span>クレジットカード支払につきましては、クレジットカード支払規定に基づいて行いますので、お申し込みの前に必ずご一読ください。</span></li><li class="flex gap-2 text-caption text-neutral-600 leading-relaxed"><span class="text-neutral-400 shrink-0">・</span><span>クレジットカード支払のお取扱い金額は、1契約1回あたり、10万円以下となっております。</span></li><li class="flex gap-2 text-caption text-neutral-600 leading-relaxed"><span class="text-neutral-400 shrink-0">・</span><span>クレジットカードの発行会社が保険料相当額をT&amp;Dフィナンシャル生命に入金させ、ご加入者さまの利用口座から保険料相当額のお振り替えをおこなう仕組みになっております。したがって、ご契約の消滅（解約・死亡等）または、T&amp;Dフィナンシャル生命にお払込みが完了された場合でも、翌月以降に保険料相当額の決済（クレジットカードの発行会社によるお振り替え）が発生することがあります。</span></li><li class="flex gap-2 text-caption text-neutral-600 leading-relaxed"><span class="text-neutral-400 shrink-0">・</span><span>保険料相当額の決済日はクレジットカードの発行会社によって異なります。決済日は、直接クレジットカードの発行会社にお問い合わせください。</span></li><li class="flex gap-2 text-caption text-neutral-600 leading-relaxed"><span class="text-neutral-400 shrink-0">・</span><span>ご利用のクレジットカード番号・カード有効期限等が変更された場合、すみやかに保険のマイページより変更ください。（ご指定いただきましたクレジットカードの発行会社によっては、クレジットカードによる保険料のお支払いができなくなる場合があります。）</span></li></ul></div></div></div><div class="rounded-2xl border border-warm-200 bg-white overflow-hidden"><button class="flex items-center justify-between w-full px-4 py-4 text-left"><h4 class="text-h6 font-bold text-neutral-800">クレジットカード支払規定</h4><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 text-primary shrink-0 transition-transform duration-300 "><path d="M6 9l6 6 6-6"></path></svg></button><div style="max-height:0px;opacity:0" class="overflow-hidden transition-all duration-300 ease-out"><div class="px-4 pb-4 border-t border-warm-200 pt-3"><ul class="space-y-3"><li class="flex gap-2 text-caption text-neutral-600 leading-relaxed"><span class="text-neutral-400 shrink-0">・</span><span>私がT&amp;Dフィナンシャル生命保険株式会社（以下「T&amp;Dフィナンシャル生命」といいます。）と締結した生命保険契約の保険料は、私が指定する私名義のクレジットカード（以下「指定カード」といいます。）で指定カード発行会社の会員規約に基づいて支払います。</span></li><li class="flex gap-2 text-caption text-neutral-600 leading-relaxed"><span class="text-neutral-400 shrink-0">・</span><span>私がT&amp;Dフィナンシャル生命に対し申し出をしない限り、保険料を前項と同様に指定カード発行会社の会員規約に基づいて、継続して支払います。</span></li><li class="flex gap-2 text-caption text-neutral-600 leading-relaxed"><span class="text-neutral-400 shrink-0">・</span><span>私は指定カード発行会社により、私が届け出た会員番号・有効期限が更新された場合であっても、保険料を異議なく支払います。</span></li><li class="flex gap-2 text-caption text-neutral-600 leading-relaxed"><span class="text-neutral-400 shrink-0">・</span><span>会員資格喪失等により、指定カード発行会社から指定カードによる保険料の支払いを停止されても異議はありません。</span></li><li class="flex gap-2 text-caption text-neutral-600 leading-relaxed"><span class="text-neutral-400 shrink-0">・</span><span>指定カードの会員番号や有効期限が変更となった場合、私に事前に通知することなく、新しい会員番号や有効期限が指定カード発行会社よりT&amp;Dフィナンシャル生命に通知されても、異議はありません。</span></li><li class="flex gap-2 text-caption text-neutral-600 leading-relaxed"><span class="text-neutral-400 shrink-0">・</span><span>私は指定カードの会員番号や有効期限が変更となった場合、すみやかにT&amp;Dフィナンシャル生命に通知します。</span></li><li class="flex gap-2 text-caption text-neutral-600 leading-relaxed"><span class="text-neutral-400 shrink-0">・</span><span>指定カードで支払った保険料については領収証は請求いたしません。</span></li></ul></div></div></div></section><div class="rounded-2xl border border-[color:var(--secondary-color-100)] bg-[color:var(--secondary-color-10)] p-4"><div class="flex items-center gap-2 mb-3"><span data-slot="badge" class="inline-flex items-center justify-center border text-xs w-fit whitespace-nowrap shrink-0 [&amp;&gt;svg]:size-3 gap-1 [&amp;&gt;svg]:pointer-events-none focus-visible:border-ring focus-visible:ring-ring/50 focus-visible:ring-[3px] aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 aria-invalid:border-destructive transition-[color,box-shadow] overflow-hidden [a&amp;]:hover:bg-secondary/90 rounded-full border-transparent px-3 py-1 font-medium bg-[color:var(--secondary-color-10)] text-[color:var(--secondary-color-700)]">重要</span><span class="text-h5 font-bold text-neutral-800">重要事項をご確認ください</span></div><div class="space-y-3"><div class="rounded-xl border bg-white overflow-hidden border-warm-200"><div class="flex items-center gap-3 px-3 py-3"><button class="flex-1 flex items-center justify-between gap-2 text-left"><span class="text-h6 font-bold text-neutral-800 leading-snug"><span class="text-primary-600 mr-1">①</span>申込に関する注意事項の確認</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 text-primary shrink-0 transition-transform duration-300 "><path d="M6 9l6 6 6-6"></path></svg></button></div><div style="max-height:0px;opacity:0" class="overflow-hidden transition-all duration-300 ease-out"><div class="px-3 pt-3 pb-4 border-t border-warm-200 max-h-80 overflow-y-auto no-sb space-y-3"><ul class="space-y-2"><li class="flex gap-2 text-caption text-neutral-600 leading-relaxed"><span class="text-neutral-400 shrink-0">・</span><span class="whitespace-pre-line">お申し込みは、日本国内に在住し、ご自身で日本語の契約内容を理解できることが条件となります。</span></li><li class="flex gap-2 text-caption text-neutral-600 leading-relaxed"><span class="text-neutral-400 shrink-0">・</span><span class="whitespace-pre-line">ご加入の成立には審査があります。審査の結果、ご加入をお引き受けできない場合があります。</span></li><li class="flex gap-2 text-caption text-neutral-600 leading-relaxed"><span class="text-neutral-400 shrink-0">・</span><span class="whitespace-pre-line">T&amp;Dフィナンシャル生命のシステム上登録できない字体については、登録可能な漢字またはカタカナでの登録となります。なお、保障内容やご契約後の諸手続き等に影響はありません。</span></li><li class="flex gap-2 text-caption text-neutral-600 leading-relaxed"><span class="text-neutral-400 shrink-0">・</span><span class="whitespace-pre-line">本保険のご加入手続き等にあたり、保険契約者（団体）は、加入対象者（被保険者）の個人情報（氏名、性別、生年月日、健康状態等）を、保険契約の引受け・継続・維持管理、給付金のお支払い、その他保険に関連・付随する業務のために利用し、引受保険会社に提供します。個人情報に変更が生じた場合も同様に取り扱います。</span></li><li class="flex gap-2 text-caption text-neutral-600 leading-relaxed"><span class="text-neutral-400 shrink-0">・</span><span class="whitespace-pre-line">保険医療等の機微（センシティブ）情報は、保険業法その他関係法令に基づき、業務の適切な運営の確保その他必要と認められる範囲に限定して取り扱います。</span></li><li class="flex gap-2 text-caption text-neutral-600 leading-relaxed"><span class="text-neutral-400 shrink-0">・</span><span class="whitespace-pre-line">個人番号および特定個人情報は、法令で定められた目的のみに利用し、その範囲を超えて利用または第三者提供は行いません。</span></li></ul><div class="space-y-3"><div class="flex gap-1.5"><span class="text-neutral-400 shrink-0">・</span><span><span class="text-caption text-neutral-600 leading-relaxed">個人情報に関するお問い合わせ（開示・訂正・利用停止等）については、以下よりご連絡ください。</span><br/><a href="https://is.tdf-life.co.jp/www7/kumikomi_hoken/form1-entry.php" target="_blank" rel="noreferrer" class="text-caption underline break-all leading-relaxed" style="color:var(--color-link)">https://is.tdf-life.co.jp/www7/kumikomi_hoken/form1-entry.php</a></span></div><div class="flex gap-1.5"><span class="text-neutral-400 shrink-0">・</span><span><span class="text-caption text-neutral-600 leading-relaxed">最新の内容は、T&amp;Dフィナンシャル生命ホームページにてご確認ください。</span><br/><a href="https://www.tdf-life.co.jp" target="_blank" rel="noreferrer" class="text-caption underline break-all leading-relaxed" style="color:var(--color-link)">https://www.tdf-life.co.jp
