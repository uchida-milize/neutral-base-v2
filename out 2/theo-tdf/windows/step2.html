(--secondary-color-10)] text-[color:var(--secondary-color-700)] px-2 py-[2px] text-[11px] font-bold leading-none">重要</span>重要事項・事前同意事項</h3><button class="grid place-items-center w-8 h-8 rounded-full bg-warm-100 text-neutral-500"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="w-4 h-4"><path d="M18 6L6 18M6 6l12 12"></path></svg></button></div><div class="px-6 py-4 overflow-y-auto no-sb space-y-6"><p class="text-caption text-neutral-500 leading-relaxed">お申込み前に、以下の内容を必ずご確認ください。</p><div class="space-y-6"><p class="flex items-center gap-2 text-h6 font-bold text-neutral-800"><span class="rounded-full bg-primary-10 text-primary-700 px-2 py-[2px] text-[11px] font-bold leading-none">事前同意</span>事前同意事項</p><div class="space-y-6"><section class="space-y-2"><p class="text-caption font-bold text-neutral-800 leading-snug">この保険について</p><ul class="space-y-2 text-caption text-neutral-600 leading-relaxed"><li class="flex gap-1.5"><span class="text-neutral-400 shrink-0">・</span><span>この保険は、●●を保険契約者（加入勧奨者）とし、保険契約者の総合取引口座にて投資信託の毎月同額つみたて契約の利用者を被保険者とする団体保険です。</span></li><li class="flex gap-1.5"><span class="text-neutral-400 shrink-0">・</span><span>保険期間中に被保険者が所定の状態に該当した場合、または死亡した場合、給付金等が支払われます。給付金額は、保険対象積立金額（毎月の積立金額×12）に基づき計算され、加入時の保険対象積立金額が基準となります。なお、保険料は毎年更新されます。</span></li></ul></section><section class="space-y-2"><p class="text-caption font-bold text-neutral-800 leading-snug">保障内容および給付について</p><ul class="space-y-2 text-caption text-neutral-600 leading-relaxed"><li class="flex gap-1.5"><span class="text-neutral-400 shrink-0">・</span><span>がん給付金は、加入者ごとの責任開始日から、その日を含めて91日目より保障を開始します。責任開始日から一定期間は保障がありませんのでご注意ください。</span></li><li class="flex gap-1.5"><span class="text-neutral-400 shrink-0">・</span><span>被保険者が所定の状態に該当し給付金等をお支払いした場合、その後、別の所定の状態に該当しても給付金等のお支払いはありません。</span></li><li class="flex gap-1.5"><span class="text-neutral-400 shrink-0">・</span><span>つみたてシミュレーションにおける目標金額や運用利益は保証されません。また、運用による損失を補填するものではありません。</span></li></ul></section><section class="space-y-2"><p class="text-caption font-bold text-neutral-800 leading-snug">お申込みにあたっての注意事項</p><ul class="space-y-2 text-caption text-neutral-600 leading-relaxed"><li class="flex gap-1.5"><span class="text-neutral-400 shrink-0">・</span><span>お申込・告知内容は、必ず被保険者ご本人様がご入力ください。</span></li><li class="flex gap-1.5"><span class="text-neutral-400 shrink-0">・</span><span>お申込みは、日本国内に在住し、ご自身で日本語の契約内容を理解できることが条件です。死亡保険金受取人についても同様の条件となります。</span></li><li class="flex gap-1.5"><span class="text-neutral-400 shrink-0">・</span><span>ご加入の成立には審査があります。審査の結果、ご加入をお引き受けできない場合があります。</span></li><li class="flex gap-1.5"><span class="text-neutral-400 shrink-0">・</span><span>ご加入には健康告知が必要です。告知事項に該当する場合は、お申込みいただけません。</span></li><li class="flex gap-1.5"><span class="text-neutral-400 shrink-0">・</span><span>保険金受取人は、被保険者から見た続柄が「配偶者および2親等内の血族」まで指定できます。内縁、婚約者、同性パートナー等、法律上の血縁関係にない方は指定できません。</span></li><li class="flex gap-1.5"><span class="text-neutral-400 shrink-0">・</span><span>この保険には解約払戻金はありません。</span></li><li class="flex gap-1.5"><span class="text-neutral-400 shrink-0">・</span><span>この保険はクーリング・オフ制度の対象外です。</span></li><li class="flex gap-1.5"><span class="text-neutral-400 shrink-0">・</span><span>投信口座の解約や積立投資の中止をされた場合、保険契約は解約いただくか、更新できませんのでご注意ください。また、保険証券を請求する権利および保険契約を解約する権利は、原則として●●が有します。</span></li></ul></section><section class="space-y-2"><p class="text-caption font-bold text-neutral-800 leading-snug">保障開始および更新について</p><ul class="space-y-2 text-caption text-neutral-600 leading-relaxed"><li class="flex gap-1.5"><span class="text-neutral-400 shrink-0">・</span><span>この契約は、申込み日の翌々月の1日（午前0時）より保障が開始されます。</span></li><li class="flex gap-1.5"><span class="text-neutral-400 shrink-0">・</span><span>満期日までにご加入者から更新しない旨のお申出がない場合、団体の取り決めにより、原則として自動更新されます。</span></li></ul></section><section class="space-y-2"><p class="text-caption font-bold text-neutral-800 leading-snug">電子交付の承諾について</p><ul class="space-y-2 text-caption text-neutral-600 leading-relaxed"><li class="flex gap-1.5"><span class="text-neutral-400 shrink-0">・</span><span>当社は、保険業法施行規則第234条第4項に基づき、同条第1項第8号および第9号に定める書面に代えて、当該書面に記載すべき事項を電磁的方法により提供します。</span></li><li class="flex gap-1.5"><span class="text-neutral-400 shrink-0">・</span><span>お客様には、当社Webサイト上で内容をご確認いただき、電磁的方法による提供にご同意いただきます。</span></li><li class="flex gap-1.5"><span class="text-neutral-400 shrink-0">・</span><span>提供された内容は、お申込み手続完了後も、当社ホームページまたはマイページ等で閲覧・ダウンロードできます。</span></li><li class="flex gap-1.5"><span class="text-neutral-400 shrink-0">・</span><span>電磁的方法による提供に同意されない場合は、お問合せフォームよりご連絡ください。</span></li></ul></section><section class="space-y-2"><p class="text-caption font-bold text-neutral-800 leading-snug">個人情報のお取り扱いについて</p><ul class="space-y-2 text-caption text-neutral-600 leading-relaxed"><li class="flex gap-1.5"><span class="text-neutral-400 shrink-0">・</span><span>保険契約者（団体）は、加入対象者（被保険者）の個人情報（氏名、性別、生年月日、健康状態等）を、本保険の引受け、維持・管理、保険金・給付金のお支払い、その他保険に関連する業務のために利用し、引受保険会社へ提供します。</span></li><li class="flex gap-1.5"><span class="text-neutral-400 shrink-0">・</span><span>個人情報に変更が生じた場合も、同様に取り扱います。</span></li><li class="flex gap-1.5"><span class="text-neutral-400 shrink-0">・</span><span>保健医療等の機微（センシティブ）情報は、保険業法その他関係法令に基づき、適切に取り扱います。</span></li><li class="flex gap-1.5"><span class="text-neutral-400 shrink-0">・</span><span>個人番号および特定個人情報は、法令で定められた目的のみに利用します。その範囲を超えて利用または第三者提供は行いません。</span></li><li class="flex gap-1.5"><span class="text-neutral-400 shrink-0">・</span><span><span>個人情報の開示、訂正、利用停止等のお申し出、その他のお問い合わせは、以下よりご連絡ください。</span><br/><a href="https://is.tdf-life.co.jp/www7/kumikomi_hoken/form1-entry.php" target="_blank" rel="noreferrer" class="break-all underline text-caption" style="color:var(--color-link)">https://is.tdf-life.co.jp/www7/kumikomi_hoken/form1-entry.php</a></span></li><li class="flex gap-1.5"><span class="text-neutral-400 shrink-0">・</span><span><span>最新の内容は、T&amp;Dフィナンシャル生命ホームページにてご確認ください。</span><br/><a href="https://www.tdf-life.co.jp" target="_blank" rel="noreferrer" class="break-all underline text-caption" style="color:var(--color-link)">ht
