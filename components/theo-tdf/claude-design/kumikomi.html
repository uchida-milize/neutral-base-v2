/* ---------- FONTS ---------- */
@font-face {
  font-family: "Zen Kaku Gothic New";
  font-weight: 300;
  font-display: swap;
  src: url("fonts/ZenKakuGothicNew-Light.ttf") format("truetype");
}
@font-face {
  font-family: "Zen Kaku Gothic New";
  font-weight: 400;
  font-display: swap;
  src: url("fonts/ZenKakuGothicNew-Regular.ttf") format("truetype");
}
@font-face {
  font-family: "Zen Kaku Gothic New";
  font-weight: 500;
  font-display: swap;
  src: url("fonts/ZenKakuGothicNew-Medium.ttf") format("truetype");
}
@font-face {
  font-family: "Zen Kaku Gothic New";
  font-weight: 700;
  font-display: swap;
  src: url("fonts/ZenKakuGothicNew-Bold.ttf") format("truetype");
}
@font-face {
  font-family: "Geist";
  font-weight: 100 900;
  font-display: swap;
  src: url("fonts/Geist-VariableFont_wght.ttf") format("truetype");
}
@font-face {
  font-family: "Geist Mono";
  font-weight: 100 900;
  font-display: swap;
  src: url("fonts/GeistMono-VariableFont_wght.ttf") format("truetype");
}

:root {
  /* ---------- primary-color (ブランド主要色 / ヘッダー / sidebar) ---------- */
  --primary-color-10: #e9f2fe;
  --primary-color-50: #c9defe;
  --primary-color-100: #98c1fc;
  --primary-color-200: #62a0fb;
  --primary-color-300: #2f81fa;
  --primary-color-400: #0768f8;
  --primary-color-500: #065fe3;
  --primary-color-600: #054eba;
  --primary-color-700: #033784;

  /* ---------- secondary-color (highlight / link / アクセント) ---------- */
  --secondary-color-10: #fff4f6;
  --secondary-color-50: #ffe3e8;
  --secondary-color-100: #ffcad4;
  --secondary-color-200: #ffaebd;
  --secondary-color-300: #ff94a7;
  --secondary-color-400: #ff7f96;
  --secondary-color-500: #ff748d;
  --secondary-color-600: #ff3156;
  --secondary-color-700: #d70027;

  /* ---------- button-color (通常ボタン) ---------- */
  --button-color-10: #ebf5ff;
  --button-color-50: #cce5ff;
  --button-color-100: #9eceff;
  --button-color-200: #6bb4ff;
  --button-color-300: #3b9bff;
  --button-color-400: #1487ff;
  --button-color-500: #007dff;
  --button-color-600: #0066d1;
  --button-color-700: #004894;

  /* ---------- cta-color (申込 / 前進 専用) ---------- */
  --cta-color-10: #ffeeee;
  --cta-color-50: #ffd5d5;
  --cta-color-100: #ffafaf;
  --cta-color-200: #ff8585;
  --cta-color-300: #ff5d5d;
  --cta-color-400: #ff3e3e;
  --cta-color-500: #ff2d2d;
  --cta-color-600: #f60000;
  --cta-color-700: #ae0000;

  /* ---------- warm (無彩色 neutral / 背景 / 区切り線) ---------- */
  --warm-50: #F2FBFE;
  --warm-100: #f5f5f4;
  --warm-200: #e7e5e4;
  --warm-300: #d6d3d1;

  /* ---------- semantic ---------- */
  --primary: var(--primary-color-500);
  --primary-foreground: #ffffff;
  --success: #1f8a4c;
  --success-10: #e8f6ee;
  --ring: var(--primary-color-400);
  --ink: #1a1a1a;
  --muted: #6b7280;

  /* ---------- semantic UI roles ----------
     プライマリー  : ヘッダー背景・CTA・選択状態  → primary-500 #065fe3
     カレント      : 選択中・現在地             → primary-500 #065fe3 (=プライマリー)
     リンク        : テキストリンク（下線+矢印）  → --color-link  #0066d1
     強調          : 数値・金額・重要テキスト    → primary-500 #065fe3 (下線なしで区別)
     不活性        : disabled文字・非選択ステップ → --color-disabled #9ca3af
     アテンション  : 必須マーク・エラー・警告    → --color-attention #d70027
     セカンダリー  : バッジ・アクセント装飾      → secondary-700 #d70027
  ----------------------------------------- */
  --color-link:       #0066d1;   /* button-600 — テキストリンク専用 */
  --color-emphasis:   #065fe3;   /* primary-500 — 数値・金額強調 */
  --color-current:    #065fe3;   /* primary-500 — 選択中・カレント状態 */
  --color-disabled:   #9ca3af;   /* neutral-400 — 不活性テキスト */
  --color-attention:  #d70027;   /* secondary-700 — 必須・エラー */

  /* ---------- type scale ---------- */
  --font-jp: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  --font-en: "Geist", -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, Menlo, monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  font-family: var(--font-jp);
  font-feature-settings: normal;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  background: var(--warm-100);
  color: var(--ink);
}

/* Wireframe placeholder fill (subtle hatch) */
.wf-ph {
  background-color: var(--warm-100);
  background-image: repeating-linear-gradient(
    -45deg,
    transparent 0,
    transparent 9px,
    rgba(0, 0, 0, 0.045) 9px,
    rgba(0, 0, 0, 0.045) 10px
  );
  border: 1px dashed var(--warm-300);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
}

/* hide scrollbar inside phone */
.no-sb::-webkit-scrollbar { width: 0; height: 0; }
.no-sb { scrollbar-width: none; }

/* focus ring */
.fld:focus { outline: none; border-color: var(--primary-color-400); }

/* form inputs use Noto Sans JP — normal-proportioned Latin/JP (no palt condensing) */
.fld, .fld::placeholder { font-family: "Noto Sans JP", var(--font-jp); font-feature-settings: normal; }

/* bottom sheet + backdrop */
@keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.sheet-up { animation: sheetUp 0.3s var(--ease-settle, cubic-bezier(0.16,1,0.3,1)); }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.fade-in { animation: fadeIn 0.22s ease-out; }
@keyframes screenFadeIn { from { opacity: 0; } to { opacity: 1; } }
.screen-enter { animation: screenFadeIn 0.28s ease-out forwards; }
@keyframes sheetPop { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
.sheet-pop { animation: sheetPop 0.2s var(--ease-settle, cubic-bezier(0.16,1,0.3,1)); }
/* スライダー値の直接入力 */
.num-input { background: transparent; border: 0; border-bottom: 2px solid var(--primary-color-200, #b9d4f5); border-radius: 0; padding: 0 2px; outline: none; transition: border-color .15s; }
.num-input:focus { border-bottom-color: var(--primary-color-500, #2a6fdb); background: var(--primary-color-10, #f2f8ff); }
.num-input::-webkit-outer-spin-button, .num-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.pin-box { width: 44px; height: 56px; border: 1px solid var(--primary-color-100, #dce8f7); border-radius: 12px; background: var(--primary-color-10, #f4f7fc); text-align: center; font-family: var(--font-en, inherit); font-weight: 600; font-size: 26px; color: var(--neutral-800, #1f2937); outline: none; transition: border-color .15s, box-shadow .15s; -moz-appearance: textfield; }
.pin-box:focus { border-color: var(--primary-color-500, #2a6fdb); box-shadow: 0 0 0 3px var(--primary-color-50, #e8f1fd); background: #fff; }
.pin-box::-webkit-outer-spin-button, .pin-box::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

/* ============================================================
   DARK MODE  — light モードを反転した配色
   data-theme="dark" を最上位ラッパーに付与。ブランド色
   (primary/cta/button) は維持し、面・罫線・テキストを反転。
   ============================================================ */
[data-theme="dark"] { --warm-100: #1b212b; --warm-300: #3a4350; background-color: #10151c !important; }

/* surfaces */
[data-theme="dark"] [class~="bg-white"]                          { background-color: #1b212b !important; }
[data-theme="dark"] [class~="bg-white/95"]                       { background-color: rgba(27,33,43,.96) !important; }
[data-theme="dark"] [class~="bg-warm-50"]                        { background-color: #232a36 !important; }
[data-theme="dark"] [class~="bg-warm-100"]                       { background-color: #131820 !important; }
[data-theme="dark"] [class~="bg-warm-200"]                       { background-color: #2c3441 !important; }
[data-theme="dark"] [class~="bg-warm-200/60"]                    { background-color: rgba(44,52,65,.6) !important; }
[data-theme="dark"] [class~="bg-warm-300"]                       { background-color: #3a4350 !important; }
[data-theme="dark"] [class~="bg-neutral-50"]                     { background-color: #232a36 !important; }
[data-theme="dark"] [class~="bg-neutral-100"]                    { background-color: #131820 !important; }
[data-theme="dark"] [class~="bg-neutral-200"]                    { background-color: #2c3441 !important; }
[data-theme="dark"] [class~="bg-primary-10"]                     { background-color: #13243f !important; }
[data-theme="dark"] [class~="bg-primary-10/60"]                  { background-color: rgba(19,36,63,.55) !important; }
[data-theme="dark"] [class~="bg-[color:var(--secondary-color-10)]"] { background-color: #2c1418 !important; }

/* borders */
[data-theme="dark"] [class~="border-warm-200"]                   { border-color: #2c3441 !important; }
[data-theme="dark"] [class~="border-warm-300"]                   { border-color: #3a4350 !important; }
[data-theme="dark"] [class~="border-neutral-200"]                { border-color: #2c3441 !important; }
[data-theme="dark"] [class~="border-neutral-300"]                { border-color: #3a4350 !important; }
[data-theme="dark"] [class~="border-primary-100"]                { border-color: #1f3a66 !important; }
[data-theme="dark"] [class~="border-primary-200"]                { border-color: #264a82 !important; }
[data-theme="dark"] [class~="border-[color:var(--secondary-color-100)]"] { border-color: #4a2230 !important; }

/* text */
[data-theme="dark"] [class~="text-neutral-900"]                  { color: #f3f5f8 !important; }
[data-theme="dark"] [class~="text-neutral-800"]                  { color: #e7ebf1 !important; }
[data-theme="dark"] [class~="text-neutral-700"]                  { color: #cfd6e0 !important; }
[data-theme="dark"] [class~="text-neutral-600"]                  { color: #b0b9c6 !important; }
[data-theme="dark"] [class~="text-neutral-500"]                  { color: #8d96a5 !important; }
[data-theme="dark"] [class~="text-neutral-400"]                  { color: #6c7585 !important; }
[data-theme="dark"] [class~="text-primary-600"]                  { color: #4c85ff !important; }
[data-theme="dark"] [class~="text-primary-700"]                  { color: #7da8ff !important; }
[data-theme="dark"] [class~="text-[color:var(--secondary-color-700)]"] { color: #ff94a7 !important; }

/* inputs */
[data-theme="dark"] .fld::placeholder                            { color: #5f6877 !important; }
[data-theme="dark"] select.fld option                            { background: #1b212b; color: #e7ebf1; }

/* placeholder hatch lines a touch lighter on dark */
[data-theme="dark"] .wf-ph { background-image: repeating-linear-gradient(-45deg, transparent 0, transparent 9px, rgba(255,255,255,0.05) 9px, rgba(255,255,255,0.05) 10px); }

/* ---------------- ATOMS ---------------- */
function Badge({ children, tone = "secondary" }) {
  const map = {
    secondary: "bg-[color:var(--secondary-color-10)] text-[color:var(--secondary-color-700)]",
    primary: "bg-primary-10 text-primary-700",

// Buttons — cta (申込/前進), button (通常), outline (罫線)
function Btn({ kind = "button", children, onClick, disabled, full = true }) {
  const base = "inline-flex items-center justify-center gap-1.5 rounded-xl px-4 h-16 text-h7 font-bold transition-colors active:scale-[.99]";
  const kinds = {
    cta: "text-white",
    button:  "text-white",
    danger:  "text-white",
    outline: "border border-button-600 bg-white text-button-600 hover:bg-button-10",
    ghost:   "text-neutral-500 hover:text-neutral-800",
  };
  const gradStyle = (kind === "cta" || kind === "button")
    ? { backgroundImage: "linear-gradient(135deg, #075FE3 0%, #64B0F7 100%)" }
    : kind === "danger"
    ? { backgroundImage: "linear-gradient(135deg, #E83A3C 0%, #F66A6C 100%)" }
    : undefined;
  return (
    <button onClick={onClick} disabled={disabled} style={{ opacity: disabled ? 0.4 : 1, ...gradStyle }}
      className={`${base} ${kinds[kind]} ${full ? "w-full" : ""} ${disabled ? "cursor-not-allowed" : ""}`}>
      {children}
    </button>
  );
}

// step progress dots — 既出（到達済み）ステップは押下でその画面へ遷移
const STEP_TO_SCREEN = { 1: 0, 2: 1, 3: 3, 4: 4, 5: 7 };
function Steps({ n, of = 5, go }) {
  return (
    <div className="flex justify-center items-center gap-0 px-5 py-2 bg-white border-b border-warm-200">
      {Array.from({ length: of }).map((_, i) => {
        const stepNo = i + 1;
        const filled = i < n;
        const active = i + 1 === n;
        const clickable = filled && typeof go === "function" && STEP_TO_SCREEN[stepNo] != null;
        return (
          <div key={i} className="flex items-center">
            {/* Step circle */}
            <button type="button" disabled={!clickable}
              onClick={clickable ? () => go(STEP_TO_SCREEN[stepNo]) : undefined}
              aria-label={`STEP ${stepNo}`}
              className={`grid place-items-center w-7 h-7 rounded-full border-2 shrink-0 font-en text-[10px] font-bold transition-colors ${
                active ? "border-primary bg-primary text-white" : 
                filled ? "border-primary bg-white text-primary" : 
                "border-warm-300 bg-white text-neutral-400"
              } ${clickable ? "cursor-pointer hover:shadow-md" : "cursor-default"}`}>
              {stepNo}
            </button>
            {/* Line between circles */}
            {i < of - 1 && (
              <div className={`w-8 h-0.5 transition-colors ${
                i + 1 < n ? "bg-primary" : "bg-warm-200"
              }`} />
            )}
          </div>
        );
      })}
    </div>
  );
}

// Wireframe form field
function Field({ label, placeholder, required, hint, value, onChange, disabled, error, errMode, anchorRef }) {
  const invalid = !!error && errMode && errMode !== 'none';
  const showText = invalid && errMode === 'inline';
  return (

function koTableFor(planId, death) {
  const map = {
    cancer:      death ? [KO_DEATH, KO_CANCER] : [KO_CANCER],
    three:       death ? [KO_DEATH, KO_THREE]  : [KO_THREE],
    care:        [KO_CARE],
    cancer_care: [KO_CARE, KO_CANCER],
    three_care:  [KO_CARE, KO_THREE],
  };
  const blocks = map[planId] || [KO_CANCER];
  const byKey = {};
  for (const block of blocks) {
    for (const row of block) {
      if (!byKey[row.k]) byKey[row.k] = { k: row.k, paras: [], checks: [] };
      const tgt = byKey[row.k];
      (row.paras || []).forEach((p) => { if (!tgt.paras.some((q) => q.t === p.t)) tgt.paras.push(p); });
      (row.checks || []).forEach((c) => { if (!tgt.checks.includes(c)) tgt.checks.push(c); });
    }
  }
  return KO_ORDER.filter((k) => byKey[k]).map((k) => byKey[k]);
}

function DisclosureQCard({ row, idx }) {
  return (
    <div className="rounded-xl border border-warm-200 bg-white overflow-hidden">
      <div className="px-3 pt-3 pb-3 space-y-2">
        {row.paras.map((p, j) => {
          // 問いかけ文を太字化：文全体が短い問いかけ（改行なし）なら全文bold、それ以外は末尾のありますか/ていますか以降をbold
          const isShortQ = /(?:ありますか|ていますか)[。。。]?(?:（[^（）]*）|\([^()]*\))?[。。。]?\s*$/.test(p.t) && !p.t.includes('\n');
          const parts = isShortQ ? [p.t] : p.t.split(/((?:ありますか|ていますか)[。。。][^\n]*)/);
          return (
            <div key={j}>
              <p className="text-caption leading-relaxed text-neutral-700">
                {parts.map((seg, k) =>
                  isShortQ || /(?:ありますか|ていますか)/.test(seg)
                    ? <strong key={k} className="font-bold text-neutral-900 text-[14px]">{seg}</strong>
                    : <span key={k}>{seg}</span>
                )}
              </p>
              {p.sub && (
                <div className="mt-2 rounded-lg border border-warm-200 overflow-hidden">
                  {p.sub.map((srow, sk) => (
                    <div key={sk} className={`grid grid-cols-[88px_1fr] ${sk > 0 ? 'border-t border-warm-200' : ''}`}>
                      <div className="bg-warm-100 px-2 py-2 flex items-center border-r border-warm-200">

                      </div>
                      <div className="px-2 py-2 text-[11px] text-neutral-700 leading-relaxed">{srow[1]}</div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        })}
        {row.checks && row.checks.length > 0 && (
          <div className="space-y-1 pt-0.5">
            {row.checks.map((c, j) => (
              <p key={j} className="text-caption font-bold text-neutral-800">{c}</p>
            ))}
          </div>
        )}
      </div>
      {/* YES/NO インジケーター */}

/* ============================================================
   iOS風 ドラムロール 日付ピッカー（年・月・日）
   慣性スクロール＋中央スナップ＋選択行ハイライトを再現
   ============================================================ */
const WHEEL_ITEM = 38;            // 各行の高さ(px)
const WHEEL_VISIBLE = 5;          // 表示行数（奇数）
const WHEEL_H = WHEEL_ITEM * WHEEL_VISIBLE;
const WHEEL_PAD = (WHEEL_H - WHEEL_ITEM) / 2;

function WheelCol({ items, index, onChange, flex, align }) {
  const ref = useRef(null);
  const [cur, setCur] = useState(index);
  const settle = useRef(null);
  const programmatic = useRef(false);

  // 外部から index が変わったら、その行へスクロールを合わせる
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const target = index * WHEEL_ITEM;
    if (Math.abs(el.scrollTop - target) > 1) {
      programmatic.current = true;
      el.scrollTop = target;
      setCur(index);
      setTimeout(() => { programmatic.current = false; }, 60);
    }
  }, [index, items.length]);

  const handleScroll = () => {
    const el = ref.current;
    if (!el) return;
    const live = Math.max(0, Math.min(items.length - 1, Math.round(el.scrollTop / WHEEL_ITEM)));
    if (live !== cur) setCur(live);          // スクロール中もハイライトを追従
    if (programmatic.current) return;
    clearTimeout(settle.current);
    settle.current = setTimeout(() => {       // 指を離して止まったらスナップ＋確定
      const i = Math.max(0, Math.min(items.length - 1, Math.round(el.scrollTop / WHEEL_ITEM)));
      el.scrollTo({ top: i * WHEEL_ITEM, behavior: "smooth" });
      if (i !== index) onChange(i);
    }, 90);
  };

  return (
    <div ref={ref} onScroll={handleScroll}
      className="no-sb overflow-y-scroll"
      style={{
        height: WHEEL_H, flex: flex || 1, scrollSnapType: "y mandatory",
        WebkitOverflowScrolling: "touch",
        WebkitMaskImage: "linear-gradient(to bottom, transparent, #000 26%, #000 74%, transparent)",
        maskImage: "linear-gradient(to bottom, transparent, #000 26%, #000 74%, transparent)",
      }}>
      <div style={{ height: WHEEL_PAD }} />
      {items.map((it, i) => {
        const dist = Math.abs(i - cur);
        return (
          <div key={i} className="grid select-none"
            style={{
              height: WHEEL_ITEM, scrollSnapAlign: "center",
              alignItems: "center", justifyItems: align === "end" ? "end" : "center",
              paddingRight: align === "end" ? 2 : 0,
              fontSize: dist === 0 ? 19 : 17,
              fontWeight: dist === 0 ? 700 : 400,
              color: dist === 0 ? "var(--neutral-color-800, #1f2937)"
                   : dist === 1 ? "var(--neutral-color-500, #6b7280)"
                   : "var(--neutral-color-300, #cbd5e1)",
              opacity: dist >= 3 ? 0.4 : 1,
              transition: "font-size .12s, color .12s",
            }}>
            {it}
          </div>
        );
      })}
      <div style={{ height: WHEEL_PAD }} />
    </div>
  );
}

function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); } // m: 1-12

function DateDrumSheet({ open, value, onClose, onDone }) {
  const NOW = new Date();
  const MIN_Y = 1925, MAX_Y = NOW.getFullYear();
  const years = []; for (let v = MAX_Y; v >= MIN_Y; v--) years.push(v); // 新しい年が上
  const months = Array.from({ length: 12 }, (_, i) => i + 1);

  const init = value ? value.split("-").map(Number) : [1990, 1, 1];
  const [yy, setYy] = useState(init[0]);
  const [mm, setMm] = useState(init[1]);
  const [dd, setDd] = useState(init[2]);

  // シートを開くたびに現在値で初期化
  useEffect(() => {
    if (!open) return;
    const v = value ? value.split("-").map(Number) : [1990, 1, 1];
    setYy(v[0]); setMm(v[1]); setDd(v[2]);
  }, [open]);

  const dim = daysInMonth(yy, mm);
  const days = Array.from({ length: dim }, (_, i) => i + 1);
  // 月末日を超えたら丸める（例: 3/31 → 2月 で 2/28 に）
  useEffect(() => { if (dd > dim) setDd(dim); }, [yy, mm]);

  if (!open) return null;
  const yIdx = years.indexOf(yy);
  const mIdx = months.indexOf(mm);
  const dIdx = days.indexOf(dd);

  return (
    <div className="absolute inset-0 z-50">
      <div className="absolute inset-0 bg-black/40 fade-in" onClick={onClose} />
      <div className="sheet-up absolute left-0 right-0 bottom-0 bg-white rounded-t-2xl shadow-xl flex flex-col">
        <div className="flex items-center justify-between px-4 pt-3 pb-2 border-b border-warm-200">
          <button onClick={onClose} className="text-h7 text-neutral-500 px-1 py-1">キャンセル</button>
          <span className="text-caption font-bold text-neutral-700">生年月日</span>
          <button onClick={() => onDone(`${yy}-${pad2(mm)}-${pad2(dd)}`)}
            className="text-h7 font-bold text-primary-600 px-1 py-1">完了</button>
        </div>
        <div className="relative px-3 py-2">
          {/* 中央の選択バンド */}
          <div className="pointer-events-none absolute left-3 right-3 rounded-lg bg-warm-100/70 border-y border-warm-200"
            style={{ top: WHEEL_PAD + 8, height: WHEEL_ITEM }} />
          <div className="relative flex">
            {/* 各列：数字ホイール（右寄せ）＋ 専用ラベル列。重なりを防止 */}
            <div className="flex items-center" style={{ flex: 1.5 }}>
              <WheelCol items={years.map((v) => `${v}`)} index={yIdx} onChange={(i) => setYy(years[i])} align="end" />
              <span className="shrink-0 w-5 pl-1 text-caption text-neutral-500 font-medium">年</span>
            </div>
            <div className="flex items-center" style={{ flex: 1 }}>
              <WheelCol items={months.map((v) => `${v}`)} index={mIdx} onChange={(i) => setMm(months[i])} align="end" />
              <span className="shrink-0 w-5 pl-1 text-caption text-neutral-500 font-medium">月</span>
            </div>
            <div className="flex items-center" style={{ flex: 1 }}>
              <WheelCol items={days.map((v) => `${v}`)} index={dIdx} onChange={(i) => setDd(days[i])} align="end" />
              <span className="shrink-0 w-5 pl-1 text-caption text-neutral-500 font-medium">日</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function pad2(n) { return String(n).padStart(2, "0"); }
function fmtBirth(v) {
  if (!v) return "";
  const [y, m, d] = v.split("-").map(Number);
  return `${y}年 ${m}月 ${d}日`;
}

// 生年月日("YYYY-MM-DD")から加入年齢を算出。未入力時は30をデフォルト。
function ageFromBirth(b) {
  if (!b) return 30;
  const d = new Date(b);
  if (isNaN(d.getTime())) return 30;
  const n = new Date();
  let a = n.getFullYear() - d.getFullYear();
  const md = n.getMonth() - d.getMonth();
  if (md < 0 || (md === 0 && n.getDate() < d.getDate())) a--;
  return a;
}

// シミュレーション上限チェック
const SIM_MAX_BENEFIT = 40000000; // 4,000万円
const SIM_MAX_MATURITY_AGE = 90;  // 加入年齢＋保障期間の上限
function simErrors(m, y, startAge) {
  const errs = [];
  if (m * 12 * y > SIM_MAX_BENEFIT)
    errs.push("保障金額が上限を超えています。積立金額×12×保障期間が4,000万円以内となるよう設定ください");
  if (startAge + y > SIM_MAX_MATURITY_AGE)
    errs.push("保障満了が上限を超えています。加入年齢＋保障期間が90歳以下となるよう設定ください");
  return errs;
}

// 給付予想額テーブル（m, y から算出）
function BenefitTable({ m, y, plan, startAge = 30 }) {
  const man = (v) => Math.round(v / 10000).toLocaleString("ja-JP");
  const yen = (v) => v.toLocaleString("ja-JP");
  const annual = m * 12;
  const maxBenefit = annual * y;
  const premiumPerMonth = plan && plan.price ? parseInt(plan.price.replace(/[^0-9]/g, ""), 10) : 0;
  const rows = [];
  for (let n = 0; n <= y; n++) {
    const age = startAge + n;
    const benefit = annual * (y - n);
    const cum = annual * n;
    rows.push({ n, age, premium: premiumPerMonth, benefit, cum });
  }
  return (
    <>
      <div className="flex items-center justify-between rounded-xl bg-primary-10 px-4 py-3">
        <span className="text-caption font-medium text-primary-700">最大給付金額　0年目</span>
        <span className="text-primary-600">
          <span className="font-en text-h3 font-semibold tabular-nums">{man(maxBenefit)}</span>
          <span className="text-h7"> 万円</span>
        </span>
      </div>
      <div className="mt-3 rounded-xl border border-warm-200 overflow-hidden">
        <div className="max-h-72 overflow-y-auto no-sb">
          <table className="w-full text-caption tabular-nums">
            <thead className="sticky top-0 bg-warm-100 text-neutral-500">
              <tr>
                {["経\n過", "年\n齢", "月払\n保険料", "給付\n金額", "合計\n積立"].map((h) => (
                  <th key={h} className="font-medium text-center px-3 py-2 whitespace-pre-line align-middle text-[14px]">{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {rows.map((r) => (
                <tr key={r.n} className={`border-t border-warm-200 ${r.n === 0 ? "bg-primary-10/60 text-neutral-900" : "text-neutral-700"}`}>
                  <td className="px-3 py-2 whitespace-nowrap align-middle text-center">{r.n}年</td>
                  <td className="px-3 py-2 whitespace-nowrap align-middle text-center">{r.age}歳</td>
                  <td className="px-3 py-2 whitespace-nowrap align-middle text-right font-bold">{yen(r.premium)}円</td>
                  <td className="px-3 py-2 whitespace-nowrap align-middle text-right">{man(r.benefit)}万円</td>
                  <td className="px-3 py-2 whitespace-nowrap align-middle text-right">{man(r.cum)}万円</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
      <p className="mt-2 text-[12px] text-neutral-400 leading-relaxed">
        ※ 表示金額は試算であり、実際の保険料・給付額を保証するものではありません。
      </p>
    </>
  );
}

                  <Ic.chevR className="w-5 h-5 text-[color:var(--secondary-color-600)] shrink-0" />
                </button>
                <div className={"flex items-start gap-3 w-full text-left pt-1 transition-opacity " + (agree ? "" : "opacity-40 pointer-events-none")}>
                  <span className={"grid place-items-center w-5 h-5 mt-0.5 rounded border-2 shrink-0 " + (agree ? "border-primary bg-primary text-white" : "border-warm-300 bg-white")}>
                    {agree && <Ic.check className="w-3 h-3" />}
                  </span>
                  <span className="text-caption text-neutral-700 leading-relaxed">上記の事前同意事項を確認し、同意します</span>
                </div>
              </div>
              {/* メールアドレスのご入力 */}
              <div ref={sendSecRef} className="rounded-2xl border border-warm-200 bg-white p-6 space-y-4">
                <h3 className="text-h7 font-bold text-neutral-800">メールアドレスのご入力</h3>
                <p className="text-caption text-neutral-600 leading-relaxed">ご入力されたメールアドレス宛にPINコード送信とご案内URLをお送りします。</p>
                <Field label="メールアドレス" placeholder="samplename@sample.co.jp" required />
              </div>
              {agree && <div style={{ height: '80px' }} aria-hidden="true" />}
            </StepSection>
          </div>
        </div>
      </div>
      <ActionBar bg={showSend ? "#F2FBFE" : undefined}>
        {showSend && (
          <div className="fade-in space-y-2">
            {emailVerified ? (
              <>
                <div className="flex items-center gap-2 rounded-xl bg-primary-10 border border-primary-100 px-4 py-3">
                  <Ic.check className="w-4 h-4 text-primary-600 shrink-0" />
                  <span className="text-caption text-primary-700">メールアドレスの認証は完了しています</span>
                </div>
                <Btn kind="cta" onClick={() => go(3)} disabled={!agree}>申込フォームへ進む<Ic.chevR className="w-4 h-4" /></Btn>
              </>
            ) : (
              <Btn kind="cta" onClick={() => go(2)} disabled={!agree}>PINコードを送信</Btn>
            )}
            {!agree && <p className="text-center text-caption text-neutral-400">同意いただくと送信できます</p>}
            {agree && (
              <div className="flex justify-end" style={{ marginTop: "24px", marginBottom: "16px" }}>
                <a href="https://faq-moneydesign.tdf-life.co.jp/" target="_blank" rel="noopener" className="inline-flex items-center gap-1.5 font-bold text-h7 cursor-pointer underline-offset-2 hover:underline" style={{ color: "var(--color-link)", fontSize: "14px" }}>
                  <img src="assets/info-circle.svg" alt="" className="w-4 h-4" />
                  よくあるご質問
                </a>
              </div>
            )}
          </div>
        )}
      </ActionBar>
      <DateDrumSheet open={pickerOpen} value={birth} onClose={() => setPickerOpen(false)} onDone={(v) => { setBirth(v); setPickerOpen(false); }} />
      <HeigaiModal open={heigaiOpen} onClose={() => setHeigaiOpen(false)} onAgree={() => setHeigaiOpen(false)} />
      {noticeOpen && (
        <div className="absolute inset-0 z-50">
          <div className="absolute inset-0 bg-black/40 fade-in" onClick={() => setNoticeOpen(false)} />
          <div className="sheet-up absolute left-0 right-0 bottom-0 bg-white rounded-t-2xl shadow-xl max-h-[88%] flex flex-col">
            <div className="flex items-center justify-between px-5 pt-4 pb-3 border-b border-warm-200">
              <h3 className="flex items-center gap-2 text-h6 font-bold text-neutral-800">
                <span className="rounded-full bg-[color:var(--secondary-color-10)] text-[color:var(--secondary-color-700)] px-2 py-0.5 text-[11px] font-bold leading-none">重要</span>
                重要事項・事前同意事項
              </h3>
              <button onClick={() => setNoticeOpen(false)} className="grid place-items-center w-8 h-8 rounded-full bg-warm-100 text-neutral-500">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" className="w-4 h-4"><path d="M18 6L6 18M6 6l12 12"/></svg>
              </button>
            </div>
            <div className="px-5 py-4 overflow-y-auto no-sb space-y-6">
              <p className="text-caption text-neutral-500 leading-relaxed">
                お申込み前に、以下の内容を必ずご確認ください。
              </p>

              <div className="space-y-6">
                <p className="flex items-center gap-2 text-h7 font-bold text-neutral-800">
                  <span className="rounded-full bg-primary-10 text-primary-700 px-2 py-0.5 text-[11px] font-bold leading-none">事前同意</span>
                  事前同意事項
                </p>
                <NoticeContent />
              </div>
            </div>
            <div className="px-5 py-3 border-t border-warm-200">
              <Btn kind="button" onClick={() => { setAgree(true); setNoticeOpen(false); }}>確認同意しました</Btn>
            </div>
          </div>
        </div>
      )}
    </>
  );
}


function Phone({ children, external, overviewMode, screenKey }) {
  const bezel = external ? "bg-neutral-400" : "bg-neutral-900";
  const notch = external ? "bg-neutral-500" : "bg-neutral-900";
  const status = external ? "bg-neutral-600 text-white" : overviewMode ? "text-neutral-800" : "text-primary-foreground";
  const statusStyle = (!external && !overviewMode) ? HEADER_GRAD_STATUS : undefined;
  return (
    <div className="relative">
      <div className={`w-[390px] h-[820px] rounded-[44px] ${bezel} p-3 shadow-2xl transition-colors duration-300`}>
        <div className="relative w-full h-full rounded-[34px] overflow-hidden flex flex-col" style={{ background: "linear-gradient(to bottom, #FFFFFF 0%, #F2FBFE 100%)" }}>
          {/* Notch pill — always visible */}
          <div className={`absolute left-1/2 -translate-x-1/2 top-2 w-28 h-6 rounded-full ${notch} z-30 pointer-events-none`} />
          {/* Status bar: hidden for overview (screen provides its own inside scroll) */}
          {!overviewMode && (
            <div className={`shrink-0 flex items-center justify-between px-6 pt-3 pb-1 text-caption font-en font-medium ${status}`} style={statusStyle}>
              <span>9:41</span>
              <span className="flex items-center gap-1"><span>5G</span><span>100%</span></span>
            </div>
          )}
          <div key={screenKey} className="screen-enter relative flex flex-col flex-1 min-h-0">
            {children}
          </div>
        </div>
      </div>
      {external && (
        <div className="absolute -top-3 left-1/2 -translate-x-1/2 rounded-full bg-neutral-700 text-white text-[10px] font-mono tracking-wide px-3 py-1 shadow-md whitespace-nowrap">
          外部サイト（GMO ペイメント）
        </div>
      )}
    </div>
  );
}

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "patternB": false,
  "simFirst": false,
  "errMode": "inline",
  "benSameAddr": true,
  "kokuchiPattern": "auto",
  "planCardStyle": "card",
  "doneVariant": "done",
}/*EDITMODE-END*/;

function App() {
  const { useTweaks, TweaksPanel, TweakSection, TweakToggle, TweakSelect } = window;
  const [tw, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [scr, setScr] = useS(0);
  const [sel, setSel] = useS("cancer_d");
  const deathOpt = deathFromSel(sel);  // 死亡保障あり/なし（selから導出）
  const [simM, setSimM] = useS(10000);  // 毎月の積立金額（共有）
  const [simY, setSimY] = useS(15);     // 保障期間（共有）
  const [emailVerified, setEmailVerified] = useS(false);
  const [phoneVerified, setPhoneVerified] = useS(false);
  const [terminated, setTerminated] = useS(false);  // 申込キャンセル→終了画面
  const patternB = tw.patternB;
  const setPatternB = (v) => { setTweak('patternB', typeof v === 'function' ? v(patternB) : v); setScr(0); };
  const NSCR = 9;
  const go = (n) => setScr(Math.max(0, Math.min(NSCR - 1, n)));
  const curStep = stepOfScreen(scr);
  const external = !!(FLOW[curStep] && FLOW[curStep].ext);

  const screens = [
    patternB ? <ScreenCombined go={go} sel={sel} setSel={setSel} deathOpt={deathOpt} m={simM} setM={setSimM} y={simY} setY={setSimY} emailVerified={emailVerified} simFirst={tw.simFirst} planCardStyle={tw.planCardStyle} /> : <ScreenOverview go={go} />,
    <ScreenStep2 go={go} sel={sel} setSel={setSel} deathOpt={deathOpt} m={simM} setM={setSimM} y={simY} setY={setSimY} emailVerified={emailVerified} simFirst={tw.simFirst} planCardStyle={tw.planCardStyle} />,
    <ScreenPin go={go} onVerified={() => setEmailVerified(true)} backScr={patternB ? 0 : 1} />,
    <ScreenForm go={go} sel={sel} deathOpt={deathOpt} m={simM} setM={setSimM} y={simY} setY={setSimY}
      backScr={emailVerified ? (patternB ? 0 : 1) : 2}
      errMode={tw.errMode} onTerminate={() => setTerminated(true)} kokuchiPattern={tw.kokuchiPattern} />,
    <ScreenStep4 go={go} sel={sel} deathOpt={deathOpt} m={simM} y={simY} benSameAddr={tw.benSameAddr} />,
    <ScreenCardInput go={go} />,
    <ScreenCardConfirm go={go} />,
    <ScreenDone go={go} variant={tw.doneVariant} />,
  ];

  return (
    <div data-theme="light" className="min-h-screen w-full bg-warm-100 transition-colors duration-300">
      <div className="mx-auto max-w-[1100px] px-6 flex items-start justify-center gap-4">
        <Rail scr={scr} go={go} />
        <main className="py-10 flex flex-col items-center gap-4">
          <TweaksPanel>
            <TweakSection label={<span style={{ color: 'var(--color-link)' }}>全体表示パターン</span>} />
            <TweakToggle label="パターンB（商品概要+プラン選択統合）" value={tw.patternB} onChange={(v) => setPatternB(v)} />
            <TweakToggle label="積立金額・保障期間をプランより先に" value={tw.simFirst} onChange={(v) => setTweak('simFirst', v)} />
            <TweakSection label={<span style={{ color: 'var(--color-link)' }}>申込フォーム</span>} />
            <TweakSelect label="入力エラー表示" value={tw.errMode} onChange={(v) => setTweak('errMode', v)} options={[
                { value: 'none',   label: 'エラーなし' },
                { value: 'inline', label: '① 各入力の下に赤字' },
                { value: 'top',    label: '② 上部にまとめて（クリックで移動）' },
                { value: 'float',  label: '③ 下部フローティング（提案）' },
              ]} />
            <TweakSelect label="プランカード表示" value={tw.planCardStyle} onChange={(v) => setTweak('planCardStyle', v)} options={[
                { value: 'card',      label: '現行カード（10枚並べ）' },
                { value: 'accordion', label: 'アコーディオン（提案）' },
              ]} />
              <TweakSelect label="告知項目パターン" value={tw.kokuchiPattern} onChange={(v) => setTweak('kokuchiPattern', v)} options={[
                { value: 'auto', label: '自動（選択中のプラン）' },
                ...KOKUCHI_PATTERNS.map((p) => ({ value: p.key, label: p.label })),
              ]} />
            <TweakSection label={<span style={{ color: 'var(--color-link)' }}>内容確認画面</span>} />
            <TweakSelect label="保険金受取人の住所" value={tw.benSameAddr ? 'same' : 'diff'} onChange={(v) => setTweak('benSameAddr', v === 'same')} options={[
                { value: 'same', label: '契約者と同じ（チェック）' },
                { value: 'diff', label: '別住所を入力' },
              ]} />
            <TweakSection label={<span style={{ color: 'var(--color-link)' }}>完了画面</span>} />
            <TweakSelect label="表示状態" value={tw.doneVariant} onChange={(v) => setTweak('doneVariant', v)} options={[
                { value: 'done',       label: '完了' },
                { value: 'processing', label: '処理中' },
                { value: 'error',      label: '処理エラー' },
                { value: 'maint',      label: 'メンテナンス中' },
              ]} />

          </TweaksPanel>
          <Phone external={external} overviewMode={(scr === 0 || scr === 7) && !terminated} screenKey={terminated ? 'ended' : scr}>{terminated ? <ScreenEnded onRestart={() => { setTerminated(false); go(0); }} /> : screens[scr]}</Phone>
          {/* prev / next outside the phone */}
          <div className="flex items-center gap-2">
            <button onClick={() => go(scr - 1)} disabled={scr === 0}
              className="flex items-center gap-1 rounded-full bg-white border border-warm-200 px-4 h-10 text-caption font-medium text-neutral-600 shadow-sm disabled:opacity-40 hover:border-warm-300">
              <Ic.chevL className="w-4 h-4" />前の画面
            </button>
            <span className="font-mono text-caption text-neutral-400 px-2">{external ? "外部サイト（GMO）" : STEP_NUMS[curStep] == null ? (FLOW[curStep] ? FLOW[curStep].label : "") : `STEP ${STEP_NUMS[curStep]} / ${TOTAL_STEPS}`}</span>
            <button onClick={() => go(scr + 1)} disabled={scr === NSCR - 1}
              className="flex items-center gap-1 rounded-full bg-white border border-warm-200 px-4 h-10 text-caption font-medium text-neutral-600 shadow-sm disabled:opacity-40 hover:border-warm-300">
              次の画面<Ic.chevR className="w-4 h-4" />
            </button>

            
          </div>
        </main>
      </div>
    </div>
  );
}

/* ============================================================
   STATE GALLERY — 静的バリアント書き出し用（?view=states）
   App / FLOW / 画面遷移は変更せず、props で開いた状態を再現するだけ。
   ============================================================ */
function StatesGallery() {
  const noop = () => {};
  const sel = "cancer", m = 10000, y = 15;
  const common = { go: noop, sel, setSel: noop, m, setM: noop, y, setY: noop };
  const frames = [
    { label: "① プラン選択 / 重要事項ボトムシート", el: <ScreenStep2 {...common} initialNoticeOpen={true} /> },
    { label: "② プラン選択 / 給付予想額アコーディオン", el: <ScreenStep2 {...common} initialSimOpen={true} /> },
    { label: "③ 申込フォーム / 積立修正シート＋給付予想額", el: <ScreenForm {...common} initialEditOpen={true} initialSheetRes={true} /> },
    { label: "④ 内容確認 / 同意項目展開＋全チェック", el: <ScreenStep4 go={noop} sel={sel} m={m} y={y} initialOpenIdx={0} initialChecks={[true, true, true, true, true]} /> },
    { label: "⑤ 内容確認 / お支払い詳細 展開", el: <ScreenStep4 go={noop} sel={sel} m={m} y={y} initialAcctOpen={true} /> },
  ];
  return (
    <div className="min-h-screen w-full bg-warm-100 p-8">
      <div className="mb-6">
        <p className="font-mono text-caption tracking-[0.14em] uppercase text-neutral-400">State Gallery</p>
        <h1 className="text-h4 font-bold text-neutral-800">状態バリアント（書き出し用）</h1>
        <a href="?" className="text-caption underline underline-offset-2" style={{ color: 'var(--color-link)' }}>← プロトタイプに戻る</a>
      </div>
      <div className="flex items-start gap-6 overflow-x-auto pb-6">
        {frames.map((f, i) => (
          <div key={i} className="flex flex-col items-center gap-2 shrink-0">
            <span className="font-mono text-caption text-neutral-500 w-[390px] text-center">{f.label}</span>
            <div className="relative w-[390px] h-[820px] overflow-hidden rounded-[28px] border border-warm-300 bg-white shadow-lg flex flex-col">
              {f.el}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

const __view = new URLSearchParams(window.location.search).get("view");
ReactDOM.createRoot(document.getElementById("root")).render(__view === "states" ? <StatesGallery /> : <App />);

</script>
</body>
</html>
